name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
          working-directory: chirpy-src

      - name: Build site
        run: bundle exec jekyll b -d "../_site${{ steps.pages.outputs.base_path }}"
        working-directory: chirpy-src
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer ../_site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/,/^http:\/\/c\.biancheng\.net/"
        working-directory: chirpy-src

      # Keep chirpy-src as the only hand-maintained site source, but mirror the
      # generated site to repository root as a compatibility fallback for
      # branch-based GitHub Pages. The Pages artifact below remains authoritative
      # when the repository is configured for GitHub Actions deployment.
      - name: Publish generated site to repository root
        if: github.event_name == 'push'
        run: |
          shopt -s dotglob nullglob
          for path in *; do
            case "$path" in
              .git|.github|.gitignore|README.md|LICENSE|chirpy-src|tools|_site)
                continue
                ;;
            esac
            rm -rf -- "$path"
          done

          cp -a _site/. .
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: publish Chirpy output [skip ci]"
          git push

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
