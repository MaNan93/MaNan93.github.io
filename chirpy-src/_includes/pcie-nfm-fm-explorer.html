<div id="pcie-field-explorer" class="pcie-field-explorer">
  <div class="pcie-explorer-toolbar">
    <label for="pcie-type-select"><strong>TLP Type</strong></label>
    <select id="pcie-type-select" aria-label="Select PCIe TLP type"></select>
    <span id="pcie-type-summary" class="pcie-type-summary"></span>
  </div>

  <div class="pcie-compare-grid">
    <section class="pcie-mode-section pcie-nfm-section">
      <h4>Non-Flit Mode</h4>
      <div id="pcie-nfm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-nfm" class="pcie-layout"></div>
    </section>
    <section class="pcie-mode-section pcie-fm-section">
      <h4>Flit Mode</h4>
      <div id="pcie-fm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-fm" class="pcie-layout"></div>
    </section>
  </div>

  <section class="pcie-detail-panel" aria-live="polite" aria-hidden="true">
    <h4 id="pcie-detail-title">字段说明</h4>
    <div id="pcie-detail-body"></div>
  </section>

  <section class="pcie-ohc-section">
    <div class="pcie-ohc-head">
      <h4>Relevant OHC</h4>
      <div id="pcie-ohc-tabs" class="pcie-ohc-tabs"></div>
    </div>
    <div id="pcie-ohc-note" class="pcie-ohc-note"></div>
    <div id="pcie-ohc-layout" class="pcie-layout"></div>
  </section>
</div>

<style>
#pcie-field-explorer{position:relative;margin:1.2rem 0 2rem;font-size:.94rem;--pcie-blue:#cfe5f5;--pcie-blue-hover:#bddcf1;--pcie-blue-active:#a9d2ed;--pcie-blue-border:#7fa9c7;--pcie-blue-text:#173b55;--pcie-blue-muted:#49687e}
#pcie-field-explorer .pcie-explorer-toolbar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
#pcie-field-explorer select{min-width:220px;padding:.4rem .55rem;border:1px solid var(--main-border-color,#bbb);border-radius:.45rem;background:var(--main-bg,#fff);color:inherit}
#pcie-field-explorer .pcie-type-summary{color:var(--text-muted-color,#777);font-size:.88rem}
#pcie-field-explorer .pcie-compare-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:1.6rem}
#pcie-field-explorer .pcie-compare-grid>section,#pcie-field-explorer .pcie-ohc-section{min-width:0}
#pcie-field-explorer .pcie-mode-section{min-width:0}
#pcie-field-explorer .pcie-mode-section+ .pcie-mode-section{border-top:1px solid var(--main-border-color,#ddd);padding-top:1.35rem}
#pcie-field-explorer .pcie-mode-section h4{margin-bottom:.25rem}
#pcie-field-explorer .pcie-mode-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:var(--text-muted-color,#777);margin-bottom:.55rem}
#pcie-field-explorer .pcie-layout{overflow-x:auto;padding-bottom:.25rem}
#pcie-field-explorer .pcie-dw{min-width:720px;margin:.72rem 0}
#pcie-field-explorer .pcie-dw-label{font-weight:700;margin-bottom:.18rem;font-size:.82rem}
#pcie-field-explorer .pcie-bit-ruler{display:grid;grid-template-columns:repeat(32,1fr);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.61rem;color:var(--text-muted-color,#777)}
#pcie-field-explorer .pcie-bit-ruler span{text-align:center;min-width:0}
#pcie-field-explorer .pcie-fields{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));min-height:68px}
#pcie-field-explorer .pcie-field{appearance:none;border:1px solid var(--pcie-blue-border);border-right:0;background:var(--pcie-blue);color:var(--pcie-blue-text);padding:.38rem .16rem;min-width:0;overflow:hidden;cursor:pointer;text-align:center;line-height:1.15;transition:background .12s ease,box-shadow .12s ease,filter .12s ease}
#pcie-field-explorer .pcie-field:last-child{border-right:1px solid var(--pcie-blue-border)}
#pcie-field-explorer .pcie-field:hover,#pcie-field-explorer .pcie-field:focus-visible{background:var(--pcie-blue-hover);outline:2px solid #4b86b4;outline-offset:1px;z-index:2;box-shadow:0 2px 8px rgba(27,72,105,.18)}
#pcie-field-explorer .pcie-field.is-active{background:var(--pcie-blue-active);outline:2px solid #2f75a8;outline-offset:1px;z-index:2;box-shadow:0 2px 10px rgba(27,72,105,.22)}
#pcie-field-explorer .pcie-field-name{display:block;font-weight:700;font-size:.8rem;white-space:normal;overflow-wrap:anywhere}
#pcie-field-explorer .pcie-field-bits{display:block;margin-top:.16rem;font-size:.66rem;color:var(--pcie-blue-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#pcie-field-explorer .pcie-detail-panel{display:none;position:absolute;z-index:100;width:min(430px,calc(100% - 1rem));padding:.9rem 1rem;background:var(--main-bg,#fff);border:1px solid var(--main-border-color,#c9cfd6);border-radius:.65rem;box-shadow:0 12px 34px rgba(0,0,0,.24);color:inherit}
#pcie-field-explorer .pcie-detail-panel.visible{display:block}
#pcie-field-explorer .pcie-detail-panel h4{margin:0 0 .45rem;font-size:.96rem}
#pcie-field-explorer .pcie-detail-panel code{font-size:.88em}
#pcie-field-explorer .pcie-detail-panel::before{content:"";position:absolute;top:-7px;left:22px;width:12px;height:12px;background:var(--main-bg,#fff);border-left:1px solid var(--main-border-color,#c9cfd6);border-top:1px solid var(--main-border-color,#c9cfd6);transform:rotate(45deg)}
#pcie-field-explorer .pcie-detail-bits{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;color:#2f75a8;margin-bottom:.35rem}
#pcie-field-explorer .pcie-detail-desc{line-height:1.55}
#pcie-field-explorer .pcie-detail-extra{margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--main-border-color,#ddd);line-height:1.5}
#pcie-field-explorer .pcie-detail-meta{margin-top:.55rem;color:var(--text-muted-color,#777);font-size:.8rem}
#pcie-field-explorer .pcie-ohc-section{margin-top:1.35rem;border-top:1px solid var(--main-border-color,#ddd);padding-top:1rem}
#pcie-field-explorer .pcie-ohc-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
#pcie-field-explorer .pcie-ohc-head h4{margin:0}
#pcie-field-explorer .pcie-ohc-tabs{display:flex;gap:.35rem;flex-wrap:wrap}
#pcie-field-explorer .pcie-ohc-tabs button{border:1px solid var(--pcie-blue-border);background:var(--pcie-blue);color:var(--pcie-blue-text);border-radius:999px;padding:.25rem .58rem;cursor:pointer;font-size:.78rem}
#pcie-field-explorer .pcie-ohc-tabs button:hover{background:var(--pcie-blue-hover)}
#pcie-field-explorer .pcie-ohc-tabs button.active{background:#4b86b4;color:#fff;border-color:#4b86b4}
#pcie-field-explorer .pcie-ohc-note{margin:.5rem 0 .7rem;color:var(--text-muted-color,#777);font-size:.86rem}
html[data-mode="dark"] #pcie-field-explorer{--pcie-blue:#284d68;--pcie-blue-hover:#315d7d;--pcie-blue-active:#386b8f;--pcie-blue-border:#5f8eae;--pcie-blue-text:#eef7fc;--pcie-blue-muted:#c2dbea}
html[data-mode="dark"] #pcie-field-explorer .pcie-detail-bits{color:#8fc7ed}
@media(max-width:760px){#pcie-field-explorer .pcie-dw{min-width:640px}#pcie-field-explorer .pcie-detail-panel{width:min(360px,calc(100% - .6rem))}}
</style>

<script>
(()=>{
const root=document.getElementById('pcie-field-explorer'); if(!root||root.dataset.ready)return; root.dataset.ready='1';
const $=s=>root.querySelector(s);
const f=(name,hi,lo,desc,extra='')=>({name,hi,lo,desc,extra});
const commonNfm=()=>[
  f('Fmt',31,29,'Format field. In Non-Flit Mode this field is part of the TLP type decode: it tells the receiver whether the base header is 3DW or 4DW and whether a Data Payload is present.','For example, 000b = 3DW/no data, 001b = 4DW/no data, 010b = 3DW/with data, 011b = 4DW/with data. FM removes this independent field and folds the format information into Type[7:0].'),
  f('Type',28,24,'Non-Flit Mode Type[4:0]. Type identifies the transaction class and, together with Fmt, uniquely determines the legacy TLP encoding.','For Memory Requests Type is 00000b; for Completion it is 01010b; Message encodings use the routing bits in the Type field. Do not interpret Type without Fmt in NFM.'),
  f('T9',23,23,'Tag bit 9. This is one of the Extended Tag bits used to extend the legacy Tag beyond Tag[7:0].','When the applicable Extended Tag capability is enabled, T9 combines with T8 and Tag[7:0] to form the larger request Tag. FM instead carries Tag[13:0] contiguously in the Header Base.'),
  f('TC',22,20,'Traffic Class. Selects the TLP Traffic Class used by the PCIe QoS / Virtual Channel mapping rules.','TC is carried end-to-end with the transaction and participates in TC-to-VC mapping. The exact service policy is implementation/system dependent.'),
  f('T8',19,19,'Tag bit 8. The second Extended Tag bit associated with the legacy Tag field.','Together with T9 and Tag[7:0], this extends the requester Tag in NFM. FM reorganizes these bits into a contiguous Tag field.'),
  f('Attr/LN/TH',18,16,'This portion of the common NFM header is overloaded by transaction type and feature use. It contains attributes and request-specific control semantics such as LN/TH where applicable.','The exact interpretation must follow the selected TLP type. One reason FM introduced Header Base + OHC is to reduce this kind of overloaded fixed-header encoding.'),
  f('TD',15,15,'TLP Digest bit. Indicates that a 32-bit End-to-End CRC (ECRC) digest is appended to the Non-Flit Mode TLP.','TD describes the legacy TLP Digest mechanism; it is not the same thing as Flit Mode trailer handling.'),
  f('EP',14,14,'Poisoned TLP indicator. Marks the transaction data as poisoned because the payload is known to contain bad or unreliable data.','Poison is propagated according to PCIe error-handling rules. Receiving EP=1 does not itself mean the packet encoding is malformed.'),
  f('Attr',13,12,'Transaction Attributes. These bits carry ordering/cacheability-related attributes defined for the selected TLP type.','Typical semantics include Relaxed Ordering / No Snoop related behavior depending on the transaction type and PCIe revision.'),
  f('AT',11,10,'Address Type for address-bearing requests. Indicates how the address is interpreted by the PCIe translation/addressing rules.','AT is meaningful only for TLP types that define it. Reserved encodings must be handled according to the Base Specification.'),
  f('Length',9,0,'Length field. For TLPs with a Data Payload, it gives the payload length in DWORD units according to the PCIe Length encoding rules.','The encoded value must be interpreted together with the TLP type; special encodings such as 0000000000b follow the Base Specification rules rather than simply meaning zero bytes.')
];
const commonFm=()=>[
  f('Type[7:0]',31,24,'Fully-decoded Flit Mode TLP Type. This field directly identifies the transaction and selects the corresponding Header Base format.','Unlike NFM, FM has no independent Fmt field. Header Base size, layout and the basic payload property are derived from Type[7:0]. Some legacy Fmt+Type concatenations retain the same hexadecimal value; MRd32 is a notable exception because FM 0x00 is NOP.'),
  f('TC',23,21,'Traffic Class in the Flit Mode Header Base. It preserves the transaction Traffic Class used for QoS / VC handling.','The semantic role is the same class of information as NFM TC, but the bit position changes because the FM common Header Base is reorganized.'),
  f('OHC[4:0]',20,16,'Orthogonal Header Content indication. It tells the receiver which optional/conditional OHC blocks follow the Header Base.','OHC carries header information that is orthogonal to the basic transaction type, such as Byte Enables, PASID, segment information, TPH fields or IDE-related information. When multiple OHC classes exist, they are serialized in the protocol-defined order.'),
  f('TS',15,13,'TLP Trailer Size / trailer-related indication used by Flit Mode.','TS tells the receiver how much TLP Trailer information is associated with the TLP. This replaces the simple legacy TD-bit view with the Flit Mode trailer mechanism.'),
  f('Attr',12,10,'Flit Mode transaction Attributes. Carries the ordering/cacheability-related attributes defined by the selected transaction type.','The field is placed contiguously in the FM common Header Base rather than using the split legacy placement.'),
  f('Length',9,0,'Payload Length in DWORD units for TLP types that carry data.','Interpret the value using the selected FM Type and the Base Specification Length rules. Header Base and OHC bytes are not included in the Data Payload Length.')
];
const nfmReqId=()=>[
  f('Requester ID',31,16,'Identifies the Function that originated the Request. In conventional BDF form this consists of Bus, Device and Function identity.','The Requester ID is echoed/translated into completion routing information so the Completion can return to the original requester. ARI/segment-aware cases follow the relevant identity rules.'),
  f('Tag[7:0]',15,8,'Low eight bits of the Request Tag. The Tag distinguishes outstanding non-posted Requests from the same Requester.','For legacy extended tags, T8/T9 in DW0 extend this field. A Completion returns the corresponding Tag so the requester can match the response to the original request.'),
  f('Last DW BE',7,4,'Last DWORD Byte Enable. Indicates which byte lanes are valid in the final DWORD of the request data/addressed range.','Together with First DW BE it describes byte granularity at the beginning/end of a request. Rules differ for 1-DW versus multi-DW transfers; reserved/illegal patterns are defined by the Base Specification.'),
  f('1st DW BE',3,0,'First DWORD Byte Enable. Indicates which byte lanes are valid in the first DWORD of the addressed range.','In FM this information is not permanently allocated in the Request Header Base; when explicit Byte Enables are needed they are carried in the appropriate OHC-A format.')
];
const fmReqId=()=>[
  f('Requester ID',31,16,'Requester identity in the FM Request Header Base. It identifies the Function that originated the transaction.','The semantic purpose remains request/completion correlation and routing identity, but FM reorganizes adjacent fields compared with NFM.'),
  f('EP',15,15,'Poisoned TLP indication for the FM request.','EP carries the same high-level poison semantic: the transaction is structurally valid but its data is known to be unreliable.'),
  f('R',14,14,'Reserved bit. Transmit with the protocol-defined reserved value and do not assign implementation-specific meaning.','Reserved bits are shown explicitly so the bit position of the surrounding protocol fields remains clear.'),
  f('Tag[13:0]',13,0,'Fourteen-bit Request Tag carried contiguously in the FM Header Base.','This significantly increases the directly encoded Tag space compared with the legacy Tag[7:0]+T8+T9 arrangement and simplifies parsing because the Tag is no longer split across DWs.')
];
const addr32n=()=>[
  f('Address[31:2]',31,2,'DWORD-aligned portion of the 32-bit request address. The low address bits are implied/overloaded by alignment and request-specific rules.','The Byte Enable fields determine byte granularity within the addressed DWORD range. The exact interpretation of low bits depends on the TLP type.'),
  f('PH / low bits',1,0,'Low two bit positions of the legacy 32-bit Memory Request address DWORD. Their interpretation may include Processing Hint related encoding or alignment semantics depending on the request form.','These positions are not simply arbitrary address bits; use the transaction-specific Base Specification format.')
];
const addr32f=()=>[
  f('Address[31:2]',31,2,'Upper/aligned portion of the 32-bit address in the FM Header Base.','Combined with AT[1:0] and the selected Type/OHC information, this identifies the addressed location and address interpretation.'),
  f('AT[1:0]',1,0,'Address Type. Selects the address interpretation / translation semantic defined for the FM request.','Because the address remains naturally aligned, these two low positions are available for AT rather than literal address bits.')
];
const addr64hi=()=>[
  f('Address[63:32]',31,0,'Upper 32 bits of a 64-bit request address.','The lower address portion is carried in the following Header Base DWORD. Together they form the complete 64-bit address used by the request.')
];
const rowsReq=(bits,fm=false)=>fm?[commonFm(),fmReqId(),...(bits===64?[addr64hi(),addr32f()]:[addr32f()])]:[commonNfm(),nfmReqId(),...(bits===64?[addr64hi(),addr32n()]:[addr32n()])];
const rowsIo=(fm=false)=>fm?[commonFm(),fmReqId(),addr32f()]:[commonNfm(),nfmReqId(),addr32n()];
const rowsCfg=(fm=false)=>fm?[
  commonFm(),fmReqId(),[
    f('Destination BDF/BF',31,16,'Identifies the Configuration Request destination Function in the FM Configuration Header Base.','The exact BDF/BF interpretation follows the applicable hierarchy / ARI rules.'),
    f('Ext Reg Num',15,12,'Upper portion of the Configuration Register Number used to reach the extended Configuration Space.','These bits combine with Register Number to select the target DWORD in Configuration Space.'),
    f('Register Number',11,2,'DWORD-aligned Configuration Space register number.','The bottom two byte positions are not part of the register number because Configuration accesses are DWORD-oriented and use Byte Enables for sub-DWORD selection.'),
    f('R',1,0,'Reserved bits in the FM Configuration Header Base.','They preserve the defined packet layout and must not be repurposed by an implementation.')
  ]
]:[
  commonNfm(),nfmReqId(),[
    f('Destination ID',31,16,'Destination Bus/Device/Function identity for a legacy Configuration Request.','Type 0/Type 1 routing rules determine how bridges and endpoints interpret this identity during enumeration/configuration.'),
    f('R',15,12,'Reserved bits.','These bits are not part of the Configuration Register Number.'),
    f('Ext Reg Num',11,8,'Extended Register Number bits for Configuration Space addresses beyond the original 256-byte region.','Used together with Register Number to select the target Configuration DWORD.'),
    f('Register Number',7,2,'Configuration register DWORD number.','Byte Enables in DW1 select valid bytes within the addressed DWORD.'),
    f('R',1,0,'Reserved low bits.','Configuration accesses are DWORD aligned; byte selection is represented by Byte Enables.')
  ]
];
const rowsCpl=(fm=false)=>fm?[
  commonFm(),[
    f('Completer ID',31,16,'Identifies the Function that generated the Completion.','Software/debug often uses this together with Completion Status to identify which completer returned the response.'),
    f('EP',15,15,'Poison indication for Completion data.','For CplD, EP indicates that the returned data is poisoned. Error handling follows the Completion and AER rules.'),
    f('LA[6]',14,14,'Bit 6 of the Lower Address field in the FM Completion Header Base.','The remaining Lower Address bits are carried elsewhere in the FM completion layout / OHC as defined for the specific completion case.'),
    f('Tag[13:0]',13,0,'Tag identifying the original Request being completed.','The requester uses this Tag to match the Completion to an outstanding request. FM carries the expanded Tag contiguously.')
  ],[
    f('Destination BDF/BF',31,16,'Destination identity corresponding to the original Requester.','This is the FM form of the completion routing identity that allows the response to reach the requester.'),
    f('LA[5:2]',15,12,'Middle portion of the Completion Lower Address.','Lower Address identifies the first valid byte returned by the Completion; low bits not present here may be supplied by OHC-A5 when required.'),
    f('Byte Count',11,0,'Number of bytes remaining for the request starting with this Completion, according to the Completion Byte Count rules.','For split Completions this allows the requester to understand how much data remains. It is not simply the current payload size.')
  ]
]:[
  commonNfm(),[
    f('Completer ID',31,16,'Identifies the Function generating the Completion.','The field is returned by the completer and is useful for routing/error attribution.'),
    f('Cpl Status',15,13,'Completion Status. Reports whether the request completed successfully or terminated with a defined Completion error status.','Common statuses include Successful Completion, Unsupported Request and Completer Abort; exact encodings are defined by the Base Specification.'),
    f('BCM',12,12,'Byte Count Modified. Used only in the specific legacy completion scenarios defined by PCIe.','BCM is normally zero for ordinary PCIe completions; do not interpret it as a generic “byte count valid” bit.'),
    f('Byte Count',11,0,'Completion Byte Count. Describes the remaining number of bytes associated with the request from this Completion onward.','This field is especially important when a read request is returned as multiple Completion TLPs.')
  ],[
    f('Requester ID',31,16,'Requester identity copied from the original Request so the Completion can be routed/matched back.','The completion path preserves this identity until the request reaches the originating Function.'),
    f('Tag[7:0]',15,8,'Low eight bits of the Request Tag copied from the original request.','Extended Tag bits follow the legacy completion format rules so the requester can reconstruct the original Tag.'),
    f('R',7,7,'Reserved bit.','Shown explicitly to preserve the exact bit layout of the legacy Completion Header.'),
    f('Lower Address',6,0,'Lower byte address of the first valid byte returned in the Completion.','Used with Byte Count and payload length to place returned read data correctly, especially when a request is split into multiple Completions.')
  ]
];
const rowsMsg=(fm=false)=>fm?[
  commonFm(),[
    f('Requester ID',31,16,'Identifies the Function originating the Message.','Some Message types use this identity for source attribution or response/routing semantics.'),
    f('EP',15,15,'Poison indication when the Message semantics permit/require poisoned data handling.','For MsgD this can qualify the associated data payload.'),
    f('R',14,8,'Reserved area in the generic FM Message Header Base.','Message-specific definitions may use separate defined fields/OHC rather than repurposing generic reserved positions.'),
    f('Message Code',7,0,'Message Code identifies the specific message semantic inside the broader Message TLP type/routing class.','Examples include power-management, error, vendor-defined and other protocol messages. Routing is determined separately by the Message Type/routing encoding.')
  ],[
    f('Message-specific / Reserved',31,0,'Message-specific or reserved DWORD. Its meaning is defined by the selected Message Code.','For generic diagrams this DWORD cannot be given one universal field decomposition because different Message definitions assign different semantics.' )
  ],[
    f('Message-specific / Reserved',31,0,'Additional Message-specific or reserved DWORD.','Consult the selected Message Code definition to determine whether fields are present here or the DWORD must be treated as reserved.')
  ]
]:[
  commonNfm(),[
    f('Requester ID',31,16,'Requester identity of the Message originator.','Used when the particular Message semantics require source identification.'),
    f('Tag',15,8,'Legacy Message Tag field where defined by the Message format.','Its exact use is Message-specific; unlike Memory Read tags, not every Message relies on request/completion matching.'),
    f('Message Code',7,0,'Selects the specific Message semantic.','The Type field supplies the legacy Message routing class; Message Code then specifies which message is being carried.')
  ],[
    f('Message-specific / Reserved',31,0,'Message-specific or reserved DWORD.','The exact field split depends on Message Code and therefore is intentionally left generic in this family-level view.')
  ],[
    f('Message-specific / Reserved',31,0,'Additional Message-specific or reserved DWORD.','Use the individual Message definition for exact bit assignments.')
  ]
];
const types=[
['MRd32','mem32','000','00000','0x00','0x03','Type value changes because FM 0x00 is NOP.'],['MRd64','mem64','001','00000','0x20','0x20','1:1 semantic translation.'],['MWr32','mem32','010','00000','0x40','0x40','1:1 semantic translation.'],['MWr64','mem64','011','00000','0x60','0x60','1:1 semantic translation.'],['MRdLk32','mem32','000','00001','0x01','0x01','Locked Memory Read, 32-bit address.'],['MRdLk64','mem64','001','00001','0x21','0x21','Locked Memory Read, 64-bit address.'],['IORd','io','000','00010','0x02','0x02','OHC-A2 is required in FM.'],['IOWr','io','010','00010','0x42','0x42','OHC-A2 is required in FM.'],['CfgRd0','cfg','000','00100','0x04','0x04','OHC-A3 is required in FM.'],['CfgWr0','cfg','010','00100','0x44','0x44','OHC-A3 is required in FM.'],['CfgRd1','cfg','000','00101','0x05','0x05','OHC-A3 is required in FM.'],['CfgWr1','cfg','010','00101','0x45','0x45','OHC-A3 is required in FM.'],['Cpl','cpl','000','01010','0x0A','0x0A','Completion without Data. OHC-A5 is conditional.'],['CplD','cpl','010','01010','0x4A','0x4A','Completion with Data. OHC-A5 is conditional.'],['CplLk','cpl','000','01011','0x0B','0x0B','Locked Completion without Data.'],['CplDLk','cpl','010','01011','0x4B','0x4B','Locked Completion with Data.'],['FetchAdd32','mem32','010','01100','0x4C','0x4C','AtomicOp request using 32-bit address header form.'],['FetchAdd64','mem64','011','01100','0x6C','0x6C','AtomicOp request using 64-bit address header form.'],['Swap32','mem32','010','01101','0x4D','0x4D','AtomicOp request using 32-bit address header form.'],['Swap64','mem64','011','01101','0x6D','0x6D','AtomicOp request using 64-bit address header form.'],['CAS32','mem32','010','01110','0x4E','0x4E','AtomicOp request using 32-bit address header form.'],['CAS64','mem64','011','01110','0x6E','0x6E','AtomicOp request using 64-bit address header form.'],['Msg','msg','001','10rrr','0x30-0x37','0x30-0x37','Message without Data; r[2:0] selects routing.'],['MsgD','msg','011','10rrr','0x70-0x77','0x70-0x77','Message with Data; r[2:0] selects routing.']
].map(x=>({name:x[0],family:x[1],fmt:x[2],type:x[3],nfm:x[4],fm:x[5],note:x[6]}));
const ohc={
'A1':{note:'Memory Requests with explicit Byte Enables and/or PASID; also Translation Requests and some Address-Routed/RC-directed Messages with PASID.',rows:[[f('Last DW BE',31,28,'Last DWORD Byte Enable carried by OHC-A1.','This is the FM location for explicit end-of-request byte qualification when A1 is present.'),f('1st DW BE',27,24,'First DWORD Byte Enable carried by OHC-A1.','This moves the legacy fixed DW1 Byte Enable information into orthogonal header content.'),f('PASID[19:0]',23,4,'Process Address Space ID associated with the transaction.','PASID distinguishes process address spaces behind the same Function and is qualified by the associated validity/privilege controls.'),f('NW/PV/PMR/ER',3,0,'Control bits associated with the A1 format.','PV qualifies PASID presence; PMR/ER carry privilege/execute-related semantics; NW is used by the transaction classes defined by the specification, such as Translation-related requests.')]]},
'A2':{note:'Required for every I/O Request in Flit Mode.',rows:[[f('Last DW BE',31,28,'Last DWORD Byte Enable for the I/O Request.','I/O Requests require explicit byte qualification, so FM places these enables in mandatory OHC-A2.'),f('1st DW BE',27,24,'First DWORD Byte Enable for the I/O Request.','Defines the valid starting bytes of the I/O transaction.'),f('Reserved',23,0,'Reserved portion of OHC-A2.','Transmit/consume according to the reserved-bit rules; these bits do not carry implementation-defined payload.')]]},
'A3':{note:'Required for Configuration Requests; carries Byte Enables and Destination Segment information.',rows:[[f('Last DW BE',31,28,'Last DWORD Byte Enable for the Configuration Request.','Configuration transactions use byte enables for sub-DWORD register access.'),f('1st DW BE',27,24,'First DWORD Byte Enable for the Configuration Request.','Defines which bytes of the addressed Configuration DWORD participate in the operation.'),f('Destination Segment',23,16,'Destination Segment number when DSV indicates it is valid.','This extends the destination identity beyond the BDF/BF encoded in the Header Base.'),f('DSV / Reserved',15,0,'Destination Segment Valid plus reserved bits.','DSV determines whether Destination Segment must be used; remaining positions follow reserved-bit requirements.')]]},
'A4':{note:'Used by ID-Routed Messages when Destination Segment and/or PASID is required.',rows:[[f('Destination Segment',31,24,'Segment of the destination for an ID-Routed Message when DSV is set.','Allows the Message destination to be qualified across PCI segment domains.'),f('PASID[15:8]',23,16,'Middle PASID byte.','Part of the Process Address Space identifier associated with the Message.'),f('DSV/PV/PMR/R/PASID[19:16]',15,8,'Validity/control bits plus upper PASID bits.','DSV qualifies Destination Segment, PV qualifies PASID, PMR carries privilege semantics, and reserved positions remain reserved.'),f('PASID[7:0]',7,0,'Low PASID byte.','Combines with the other PASID slices to form PASID[19:0].')]]},
'A5':{note:'Required for unsuccessful Completions, for Non-UIO Completions with LA[1:0] != 00b, and when explicit segment information is required.',rows:[[f('Destination Segment',31,24,'Segment of the Completion destination when DSV makes it valid.','This qualifies the destination identity in the Completion Header Base.'),f('Completer Segment',23,16,'PCI Segment containing the Completer.','Carries segment-level identity that is not always required in the compact Completion Header Base.'),f('DSV / Reserved',15,8,'Destination Segment Valid plus reserved positions.','DSV indicates whether Destination Segment participates in the routing identity.'),f('LA[1:0] / Cpl Status',7,0,'Completion-specific low address/status information carried by OHC-A5.','A5 is used when those conditional fields cannot be omitted from the compact FM Completion Header Base, including unsuccessful completion cases.')]]},
'B':{note:'Used for TLP Processing Hints on applicable Address-Routed Requests.',rows:[[f('Reserved',31,24,'Reserved byte in OHC-B.','It does not carry application data or implementation-defined metadata.'),f('ST[15:8]',23,16,'Upper byte of the Steering Tag used by TLP Processing Hints.','ST helps the platform steer/cache/process transactions according to TPH semantics.'),f('ST[7:0]',15,8,'Lower byte of the Steering Tag.','Together with ST[15:8] this forms the complete Steering Tag.'),f('PH/HV/AMA/AV',7,0,'Processing Hint and associated validity/address-matching controls.','PH conveys the hint; HV/AV qualify fields, and AMA participates in the address matching attribute semantics defined for TPH.')]]},
'C':{note:'Required for IDE TLPs; also used in some non-IDE cases to carry Requester Segment information.',rows:[[f('Requester Segment',31,24,'Segment containing the Requester when Requester Segment Valid indicates it is present.','This extends Requester identity when a segment number must accompany the BDF/BF identity.'),f('PR_Sent_Counter',23,16,'Protected/IDE-related counter field used by the applicable integrity/replay protection mechanism.','Interpretation is tied to the IDE rules rather than ordinary transaction ordering.'),f('Stream_ID',15,8,'IDE Stream ID selecting the Integrity and Data Encryption stream context.','Used by IDE-capable components to apply the correct protection context.'),f('Sub-Stream/RSV/R/K/T',7,0,'IDE sub-stream and associated control/validity bits.','These bits identify the protected sub-stream and carry the Requester Segment Valid / other IDE control semantics defined by OHC-C.')]]}
};
function layoutFor(t,fm){if(t.family==='mem32')return rowsReq(32,fm);if(t.family==='mem64')return rowsReq(64,fm);if(t.family==='io')return rowsIo(fm);if(t.family==='cfg')return rowsCfg(fm);if(t.family==='cpl')return rowsCpl(fm);return rowsMsg(fm)}
function ohcFor(t){if(t.family==='mem32'||t.family==='mem64')return['A1','B','C'];if(t.family==='io')return['A2','C'];if(t.family==='cfg')return['A3','C'];if(t.family==='cpl')return['A5','C'];return['A1','A4','B','C']}
function bitsText(x){return x.hi===x.lo?`bit ${x.hi}`:`bits ${x.hi}:${x.lo}`}
function ruler(){return `<div class="pcie-bit-ruler">${Array.from({length:32},(_,i)=>`<span>${31-i}</span>`).join('')}</div>`}
function hideDetail(){const p=$('.pcie-detail-panel');p.classList.remove('visible');p.setAttribute('aria-hidden','true');root.querySelectorAll('.pcie-field.is-active').forEach(x=>x.classList.remove('is-active'))}
function positionDetail(anchor){const panel=$('.pcie-detail-panel'),rr=root.getBoundingClientRect(),ar=anchor.getBoundingClientRect();panel.classList.add('visible');panel.setAttribute('aria-hidden','false');const pw=panel.offsetWidth,ph=panel.offsetHeight;let left=ar.left-rr.left+Math.min(ar.width/2,28)-22;left=Math.max(4,Math.min(left,root.clientWidth-pw-4));let top=ar.bottom-rr.top+10;if(top+ph>root.clientHeight&&ar.top-rr.top-ph-10>0)top=ar.top-rr.top-ph-10;panel.style.left=`${left}px`;panel.style.top=`${top}px`}
function renderRows(el,rows,mode,t){el.innerHTML='';rows.forEach((r,i)=>{const wrap=document.createElement('div');wrap.className='pcie-dw';wrap.innerHTML=`<div class="pcie-dw-label">DW${i}</div>${ruler()}<div class="pcie-fields"></div>`;const g=wrap.querySelector('.pcie-fields');r.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='pcie-field';b.style.gridColumn=`${32-x.hi} / ${33-x.lo}`;b.innerHTML=`<span class="pcie-field-name">${x.name}</span><span class="pcie-field-bits">${x.hi===x.lo?x.hi:x.hi+':'+x.lo}</span>`;b.addEventListener('click',e=>{e.stopPropagation();root.querySelectorAll('.pcie-field.is-active').forEach(y=>y.classList.remove('is-active'));b.classList.add('is-active');showDetail(`${mode} · DW${i} · ${x.name}`,x,t,b)});g.appendChild(b)});el.appendChild(wrap)})}
function showDetail(title,x,t,anchor){$('#pcie-detail-title').textContent=title;$('#pcie-detail-body').innerHTML=`<div class="pcie-detail-bits">${bitsText(x)}</div><div class="pcie-detail-desc">${x.desc}</div>${x.extra?`<div class="pcie-detail-extra">${x.extra}</div>`:''}<div class="pcie-detail-meta">Current TLP: ${t.name}; NFM ${t.nfm} → FM ${t.fm}.</div>`;positionDetail(anchor)}
function renderOHC(t){const names=ohcFor(t),tabs=$('#pcie-ohc-tabs');tabs.innerHTML='';names.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent='OHC-'+n;b.addEventListener('click',()=>drawOHC(n,t,b));tabs.appendChild(b);if(i===0)setTimeout(()=>drawOHC(n,t,b),0)})}
function drawOHC(n,t,btn){root.querySelectorAll('.pcie-ohc-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const o=ohc[n];$('#pcie-ohc-note').textContent=o.note;renderRows($('#pcie-ohc-layout'),o.rows,'OHC-'+n,t);hideDetail()}
function selectType(t){$('#pcie-type-summary').textContent=`NFM ${t.nfm}  →  FM ${t.fm} · ${t.note}`;$('#pcie-nfm-meta').textContent=`Fmt=${t.fmt}, Type=${t.type}, Byte0=${t.nfm}`;$('#pcie-fm-meta').textContent=`Type[7:0]=${t.fm}`;renderRows($('#pcie-nfm'),layoutFor(t,false),'NFM',t);renderRows($('#pcie-fm'),layoutFor(t,true),'FM',t);renderOHC(t);hideDetail()}
document.addEventListener('click',e=>{if(!e.target.closest('#pcie-field-explorer .pcie-field')&&!e.target.closest('#pcie-field-explorer .pcie-detail-panel'))hideDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideDetail()});
window.addEventListener('resize',hideDetail,{passive:true});
const sel=$('#pcie-type-select');types.forEach((t,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=t.name;sel.appendChild(o)});sel.addEventListener('change',()=>selectType(types[Number(sel.value)]));sel.value=types.findIndex(x=>x.name==='MWr64');selectType(types[Number(sel.value)]);
})();
</script>
