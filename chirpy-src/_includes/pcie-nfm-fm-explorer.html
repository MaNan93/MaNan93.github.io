<div id="pcie-field-explorer" class="pcie-field-explorer">
  <div class="pcie-explorer-toolbar">
    <label for="pcie-type-select"><strong>TLP Type</strong></label>
    <select id="pcie-type-select" aria-label="Select PCIe TLP type"></select>
    <span id="pcie-type-summary" class="pcie-type-summary"></span>
  </div>

  <div class="pcie-compare-grid">
    <section class="pcie-mode-section pcie-nfm-section">
      <h4>Non-Flit Mode</h4>
      <div id="pcie-nfm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-nfm" class="pcie-layout"></div>
    </section>
    <section class="pcie-mode-section pcie-fm-section">
      <h4>Flit Mode</h4>
      <div id="pcie-fm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-fm" class="pcie-layout"></div>
    </section>
  </div>

  <section class="pcie-detail-panel" aria-live="polite" aria-hidden="true">
    <h4 id="pcie-detail-title">字段说明</h4>
    <div id="pcie-detail-body"></div>
  </section>

  <section class="pcie-ohc-section">
    <div class="pcie-ohc-head">
      <h4>Relevant OHC</h4>
      <div id="pcie-ohc-tabs" class="pcie-ohc-tabs"></div>
    </div>
    <div id="pcie-ohc-note" class="pcie-ohc-note"></div>
    <div id="pcie-ohc-layout" class="pcie-layout"></div>
  </section>
</div>

<style>
#pcie-field-explorer{position:relative;margin:1.2rem 0 2rem;font-size:.94rem;--pcie-blue-border:#7fa9c7;--pcie-blue-text:#173b55;--pcie-blue-muted:#49687e;--pcie-ruler:#b8d8ee;--pcie-ruler-border:#6f9fbe;--pcie-field:#fff;--pcie-field-hover:#f3f8fc;--pcie-field-text:#24384a;--pcie-active:#cfeecd;--pcie-active-border:#6ba66e;--pcie-active-text:#204b27}
#pcie-field-explorer .pcie-explorer-toolbar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
#pcie-field-explorer select{min-width:220px;padding:.4rem .55rem;border:1px solid var(--main-border-color,#bbb);border-radius:.45rem;background:var(--main-bg,#fff);color:inherit}
#pcie-field-explorer .pcie-type-summary{color:var(--text-muted-color,#777);font-size:.88rem}
#pcie-field-explorer .pcie-compare-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:1.35rem}
#pcie-field-explorer .pcie-mode-section+ .pcie-mode-section{border-top:1px solid var(--main-border-color,#ddd);padding-top:1.15rem}
#pcie-field-explorer .pcie-mode-section h4{margin-bottom:.25rem}
#pcie-field-explorer .pcie-mode-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:var(--text-muted-color,#777);margin-bottom:.5rem}
#pcie-field-explorer .pcie-layout{overflow-x:auto;padding-bottom:.2rem}
#pcie-field-explorer .pcie-bit-table{min-width:760px}
#pcie-field-explorer .pcie-bit-ruler-row{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:stretch}
#pcie-field-explorer .pcie-ruler-spacer{background:var(--pcie-ruler);border:1px solid var(--pcie-ruler-border);border-right:0}
#pcie-field-explorer .pcie-bit-ruler{display:grid;grid-template-columns:repeat(32,1fr);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.62rem;font-weight:600;color:var(--pcie-blue-text);background:var(--pcie-ruler);border:1px solid var(--pcie-ruler-border);min-height:22px;align-items:center}
#pcie-field-explorer .pcie-bit-ruler span{text-align:center;min-width:0;line-height:22px}
#pcie-field-explorer .pcie-dw-row{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:stretch;margin-top:-1px}
#pcie-field-explorer .pcie-dw-label{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.76rem;background:var(--pcie-ruler);color:var(--pcie-blue-text);border:1px solid var(--pcie-ruler-border);border-right:0;min-height:62px}
#pcie-field-explorer .pcie-fields{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));min-height:62px}
#pcie-field-explorer .pcie-field{appearance:none;border:1px solid var(--pcie-blue-border);border-right:0;background:var(--pcie-field);color:var(--pcie-field-text);padding:.34rem .14rem;min-width:0;overflow:hidden;cursor:pointer;text-align:center;line-height:1.12;transition:background .12s ease,box-shadow .12s ease,color .12s ease}

#pcie-field-explorer .pcie-field:hover,#pcie-field-explorer .pcie-field:focus-visible{background:var(--pcie-field-hover);outline:2px solid #4b86b4;outline-offset:-2px;z-index:2}
#pcie-field-explorer .pcie-field.is-active{background:var(--pcie-active);color:var(--pcie-active-text);border-color:var(--pcie-active-border);outline:2px solid var(--pcie-active-border);outline-offset:-2px;z-index:3;box-shadow:0 1px 8px rgba(60,120,65,.2)}
#pcie-field-explorer .pcie-field-name{display:block;font-weight:700;font-size:.78rem;white-space:normal;overflow-wrap:anywhere}
#pcie-field-explorer .pcie-field-bits{display:block;margin-top:.13rem;font-size:.64rem;color:var(--pcie-blue-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#pcie-field-explorer .pcie-field.is-active .pcie-field-bits{color:#4f7553}
#pcie-field-explorer .pcie-detail-panel{--pcie-arrow-left:24px;display:none;position:absolute;z-index:100;width:min(470px,calc(100% - 1rem));padding:.95rem 1.05rem;background:var(--main-bg,#fff);border:1px solid var(--pcie-ruler-border);border-radius:.65rem;box-shadow:0 12px 34px rgba(0,0,0,.24);color:inherit}
#pcie-field-explorer .pcie-detail-panel.visible{display:block}
#pcie-field-explorer .pcie-detail-panel h4{margin:0 0 .5rem;font-size:.98rem;color:var(--pcie-blue-text)}
#pcie-field-explorer .pcie-detail-panel::before{content:"";position:absolute;top:-7px;left:calc(var(--pcie-arrow-left) - 6px);width:12px;height:12px;background:var(--main-bg,#fff);border-left:1px solid var(--pcie-ruler-border);border-top:1px solid var(--pcie-ruler-border);transform:rotate(45deg)}
#pcie-field-explorer .pcie-detail-panel.arrow-bottom::before{top:auto;bottom:-7px;border-left:0;border-top:0;border-right:1px solid var(--pcie-ruler-border);border-bottom:1px solid var(--pcie-ruler-border)}
#pcie-field-explorer .pcie-detail-row{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.55rem;padding:.28rem 0;line-height:1.5}
#pcie-field-explorer .pcie-detail-label{font-weight:700;color:var(--pcie-blue-muted)}
#pcie-field-explorer .pcie-detail-bits{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;color:#2f75a8}
#pcie-field-explorer .pcie-detail-extra{margin-top:.42rem;padding-top:.5rem;border-top:1px solid var(--main-border-color,#ddd)}
#pcie-field-explorer .pcie-detail-meta{margin-top:.55rem;color:var(--text-muted-color,#777);font-size:.8rem}
#pcie-field-explorer .pcie-ohc-section{margin-top:1.2rem;border-top:1px solid var(--main-border-color,#ddd);padding-top:.9rem}
#pcie-field-explorer .pcie-ohc-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
#pcie-field-explorer .pcie-ohc-head h4{margin:0}
#pcie-field-explorer .pcie-ohc-tabs{display:flex;gap:.35rem;flex-wrap:wrap}
#pcie-field-explorer .pcie-ohc-tabs button{border:1px solid var(--pcie-blue-border);background:var(--pcie-field);color:var(--pcie-field-text);border-radius:999px;padding:.25rem .58rem;cursor:pointer;font-size:.78rem}
#pcie-field-explorer .pcie-ohc-tabs button:hover{background:var(--pcie-field-hover)}
#pcie-field-explorer .pcie-ohc-tabs button.active{background:var(--pcie-active);color:var(--pcie-active-text);border-color:var(--pcie-active-border)}
#pcie-field-explorer .pcie-ohc-note{margin:.5rem 0 .65rem;color:var(--text-muted-color,#777);font-size:.86rem}
html[data-mode="dark"] #pcie-field-explorer{--pcie-blue-border:#5f8eae;--pcie-blue-text:#eef7fc;--pcie-blue-muted:#c2dbea;--pcie-ruler:#326584;--pcie-ruler-border:#77a9c8;--pcie-field:#1f242b;--pcie-field-hover:#29313a;--pcie-field-text:#e8eef4;--pcie-active:#315b38;--pcie-active-border:#6fa879;--pcie-active-text:#f0fff2}
html[data-mode="dark"] #pcie-field-explorer .pcie-field.is-active .pcie-field-bits{color:#c7e7cc}
html[data-mode="dark"] #pcie-field-explorer .pcie-detail-bits{color:#8fc7ed}
@media(max-width:760px){#pcie-field-explorer .pcie-bit-table{min-width:680px}#pcie-field-explorer .pcie-detail-panel{width:min(390px,calc(100% - .6rem))}#pcie-field-explorer .pcie-detail-row{grid-template-columns:4.8rem minmax(0,1fr)}}
</style>

<script>
(()=>{
const root=document.getElementById('pcie-field-explorer'); if(!root||root.dataset.ready)return; root.dataset.ready='1';
const $=s=>root.querySelector(s);
const f=(name,hi,lo,desc,extra='')=>({name,hi,lo,desc,extra});

const commonNfm=()=>[
  f('Fmt',31,29,'Format field. In Non-Flit Mode it participates in the primary TLP decode and indicates header length plus whether Data is present.','Typical values: 000b=3DW/no data, 001b=4DW/no data, 010b=3DW/with data, 011b=4DW/with data. FM removes this independent field and folds the format semantic into Type[7:0].'),
  f('Type',28,24,'NFM Type[4:0]. Together with Fmt it identifies the transaction class and determines how the remaining Header DWORDs are decoded.','Memory Requests use Type=00000b, Completions use 01010b, and legacy Message Type includes routing information. Type alone is not enough to decode an NFM TLP.'),
  f('T9',23,23,'Legacy Extended Tag bit 9.','When enabled, T9 combines with T8 and Tag[7:0] to enlarge the Request Tag. FM instead carries Tag[13:0] contiguously.'),
  f('TC',22,20,'Traffic Class used for PCIe QoS and TC-to-VC mapping.','TC is an end-to-end transaction attribute; it affects service/VC selection but does not change the address itself.'),
  f('T8',19,19,'Legacy Extended Tag bit 8.','T8 and T9 extend Tag[7:0] in NFM. FM reorganizes the complete Tag into one contiguous field.'),
  f('Attr/LN/TH',18,16,'Overloaded NFM common-header positions carrying Attributes and request-specific controls depending on TLP type.','Exact interpretation is transaction-dependent. FM reduces this overloading by separating core Header Base fields from optional OHC.'),
  f('TD',15,15,'TLP Digest Present. In NFM it indicates a 32-bit ECRC digest follows the TLP.','This belongs to the legacy TLP Digest mechanism and is not the same as FM trailer handling.'),
  f('EP',14,14,'Poisoned TLP indicator. It marks transaction data as known-bad while the packet remains structurally valid.','For data-bearing Requests/Completions, EP propagates poisoned-data semantics into error handling.'),
  f('Attr',13,12,'Transaction Attributes such as ordering/cacheability-related semantics.','The exact meaning depends on TLP type and revision; FM carries the same category of information in a reorganized common header.'),
  f('AT',11,10,'Address Type for address-bearing Requests.','AT selects the protocol-defined address interpretation/translation semantic and must be interpreted with the Request type.'),
  f('Length',9,0,'Payload Length in DWORD units for data-bearing TLPs.','Header and prefix bytes are not counted as Data Payload. Special Length encodings follow the Base Specification rules.')
];
const commonFm=()=>[
  f('Type[7:0]',31,24,'Fully-decoded Flit Mode Type. It directly identifies the transaction and selects the Header Base format/size.','FM has no independent Fmt field. Many legacy Fmt+Type values preserve their hexadecimal value; MRd32 is a notable remap because FM 0x00 is NOP.'),
  f('TC',23,21,'Traffic Class in the FM common Header Base.','Semantic role is the same category as NFM TC, but the bit location changes.'),
  f('OHC[4:0]',20,16,'Orthogonal Header Content indication. It tells the receiver which additional OHC blocks follow the Header Base.','OHC carries fields that are not needed in every instance: Byte Enables, PASID, segment information, TPH information, IDE context, or conditional Completion information.'),
  f('TS',15,13,'TLP Trailer Size / trailer-related indication in Flit Mode.','It tells the receiver how much trailer information belongs to the TLP and is not equivalent to the legacy TD bit.'),
  f('Attr',12,10,'FM transaction Attributes.','Carries ordering/cacheability-related semantics in a contiguous FM common-header position.'),
  f('Length',9,0,'FM Data Payload Length in DWORD units.','Header Base, OHC and TLP Trailer are not part of this Data Payload length.')
];
const nfmReqId=()=>[
  f('Requester ID',31,16,'Identifies the Function that originated the Request.','Used for routing/source identity and for associating returned Completions with the originating requester.'),
  f('Tag[7:0]',15,8,'Low eight bits of the Request Tag used to distinguish outstanding non-posted Requests.','A Completion returns the matching Tag. Legacy extended Tags may also use T8/T9; FM carries Tag[13:0] contiguously.'),
  f('Last DW BE',7,4,'Last DWORD Byte Enable. Selects valid byte lanes in the final DWORD of the Request.','Together with First DW BE it represents byte granularity at the transfer boundaries. In FM this information moves to the applicable OHC-A format when needed.'),
  f('1st DW BE',3,0,'First DWORD Byte Enable. Selects valid byte lanes in the first addressed DWORD.','FM removes it from the fixed Request Header Base and uses OHC-A1/A2/A3 depending on Request family.')
];
const fmReqId=()=>[
  f('Requester ID',31,16,'Requester identity in the FM Request Header Base.','Same high-level purpose as NFM Requester ID, with surrounding fields reorganized.'),
  f('EP',15,15,'Poisoned TLP indication for the FM Request.','Marks associated data as unreliable while the TLP itself remains structurally valid.'),
  f('R',14,14,'Reserved bit.','Must follow the protocol reserved-bit rules and must not be reused as private metadata.'),
  f('Tag[13:0]',13,0,'Fourteen-bit Request Tag carried contiguously in the FM Header Base.','Returned by the corresponding Completion for matching to the outstanding Request context.')
];
const addr32n=()=>[f('Address[31:2]',31,2,'DWORD-aligned portion of a 32-bit Request address.','Byte Enables and request-specific low-bit semantics define the exact byte range.'),f('PH / low bits',1,0,'Low positions with request/feature-specific semantics rather than ordinary Address[1:0].','For applicable requests these positions participate in Processing Hint or alignment-related encoding.')];
const addr32f=()=>[f('Address[31:2]',31,2,'Aligned portion of the 32-bit FM address.','Interpreted together with Type, AT and relevant OHC.'),f('AT[1:0]',1,0,'Address Type for the FM request.','Selects the protocol-defined address interpretation/translation semantic.')];
const addr64hi=()=>[f('Address[63:32]',31,0,'Upper 32 bits of a 64-bit Request address.','The following DWORD supplies the lower aligned address portion.')];
const rowsReq=(bits,fm=false)=>fm?[commonFm(),fmReqId(),...(bits===64?[addr64hi(),addr32f()]:[addr32f()])]:[commonNfm(),nfmReqId(),...(bits===64?[addr64hi(),addr32n()]:[addr32n()])];
const rowsIo=(fm=false)=>fm?[commonFm(),fmReqId(),addr32f()]:[commonNfm(),nfmReqId(),addr32n()];
const rowsCfg=(fm=false)=>fm?[commonFm(),fmReqId(),[f('Destination BDF/BF',31,16,'Target Function identity for the Configuration Request.','Segment qualification, when needed, is carried separately in OHC-A3.'),f('Ext Reg Num',15,12,'Upper Configuration Register Number bits for Extended Configuration Space.','Combines with Register Number to select the addressed Configuration DWORD.'),f('Register Number',11,2,'DWORD-aligned Configuration register number.','Sub-DWORD selection is expressed by Byte Enables in OHC-A3.'),f('R',1,0,'Reserved bits.','No transaction semantic.')]]:[commonNfm(),nfmReqId(),[f('Destination ID',31,16,'Destination BDF identity for the legacy Configuration Request.','Type 0/Type 1 routing determines how bridges forward it.'),f('R',15,12,'Reserved bits.','Not part of the Configuration Register Number.'),f('Ext Reg Num',11,8,'Extended Register Number bits.','Used with Register Number for Extended Configuration Space.'),f('Register Number',7,2,'Configuration register DWORD number.','First DW BE selects bytes within the addressed DWORD.'),f('R',1,0,'Reserved low bits.','Configuration accesses are DWORD aligned.')]];
const rowsCpl=(fm=false)=>fm?[commonFm(),[f('Completer ID',31,16,'Identifies the Function generating the Completion.','Used for routing, debug and error attribution.'),f('EP',15,15,'Poison indication for Completion data.','For CplD it marks returned data as poisoned.'),f('LA[6]',14,14,'Bit 6 of Completion Lower Address in the FM Header Base.','Other lower-address/status information may be carried elsewhere or in OHC-A5 when required.'),f('Tag[13:0]',13,0,'Tag copied from the original Request.','Used by the requester to match the Completion to an outstanding transaction.')],[f('Destination BDF/BF',31,16,'Destination identity corresponding to the original requester.','Segment qualification can be carried through OHC-A5 when required.'),f('LA[5:2]',15,12,'Middle portion of Completion Lower Address.','Low address/status information may be provided by OHC-A5 when needed.'),f('Byte Count',11,0,'Bytes remaining for the Request beginning with this Completion.','Important for split read Completions; it is not simply the current payload size.')]]:[commonNfm(),[f('Completer ID',31,16,'Identifies the Function that generated the Completion.','Useful for routing, debug and error attribution.'),f('Cpl Status',15,13,'Completion Status. Reports success or a defined Completion error status.','Examples include Successful Completion, Unsupported Request and Completer Abort.'),f('BCM',12,12,'Byte Count Modified legacy control.','Normally zero in ordinary PCIe Completion flows.'),f('Byte Count',11,0,'Completion Byte Count.','Tracks remaining bytes, especially when a read is returned by multiple Completion TLPs.')],[f('Requester ID',31,16,'Requester identity copied from the original Request.','Routes/matches the Completion back to the requester.'),f('Tag[7:0]',15,8,'Low Request Tag bits.','Used with applicable extended Tag bits to identify the outstanding transaction.'),f('R',7,7,'Reserved bit.','Shown to preserve exact layout.'),f('Lower Address',6,0,'Lower byte address of the first valid byte returned.','Used with Byte Count and payload length to place returned data correctly.')]];
const rowsMsg=(fm=false)=>fm?[commonFm(),[f('Requester ID',31,16,'Function originating the Message.','Used by Message definitions that require source identity.'),f('EP',15,15,'Poison indication where applicable.','For MsgD it may qualify associated data.'),f('R',14,8,'Reserved generic Message-header area.','Message-specific data is carried only where defined by the selected Message/OHC.'),f('Message Code',7,0,'Identifies the specific Message semantic.','Routing is selected by the Message Type/routing encoding, while Message Code selects the concrete message.')],[f('Message-specific / Reserved',31,0,'Message-specific or reserved DWORD.','Exact meaning depends on Message Code.')],[f('Message-specific / Reserved',31,0,'Additional Message-specific or reserved DWORD.','Decode only according to the selected Message definition.')]]:[commonNfm(),[f('Requester ID',31,16,'Requester identity of the Message originator.','Used by Message definitions that require source identity.'),f('Tag',15,8,'Legacy Message Tag field where defined.','Use is Message-specific; not every Message uses request/completion matching.'),f('Message Code',7,0,'Selects the concrete Message semantic.','The Type field supplies the legacy Message routing class.')],[f('Message-specific / Reserved',31,0,'Message-specific or reserved DWORD.','Exact split depends on Message Code.')],[f('Message-specific / Reserved',31,0,'Additional Message-specific or reserved DWORD.','Use the individual Message definition for exact assignments.')]];

const types=[
['MRd32','mem32','000','00000','0x00','0x03','Type value changes because FM 0x00 is NOP.'],['MRd64','mem64','001','00000','0x20','0x20','1:1 semantic translation.'],['MWr32','mem32','010','00000','0x40','0x40','1:1 semantic translation.'],['MWr64','mem64','011','00000','0x60','0x60','1:1 semantic translation.'],['MRdLk32','mem32','000','00001','0x01','0x01','Locked Memory Read, 32-bit address.'],['MRdLk64','mem64','001','00001','0x21','0x21','Locked Memory Read, 64-bit address.'],['IORd','io','000','00010','0x02','0x02','OHC-A2 is required in FM.'],['IOWr','io','010','00010','0x42','0x42','OHC-A2 is required in FM.'],['CfgRd0','cfg','000','00100','0x04','0x04','OHC-A3 is required in FM.'],['CfgWr0','cfg','010','00100','0x44','0x44','OHC-A3 is required in FM.'],['CfgRd1','cfg','000','00101','0x05','0x05','OHC-A3 is required in FM.'],['CfgWr1','cfg','010','00101','0x45','0x45','OHC-A3 is required in FM.'],['Cpl','cpl','000','01010','0x0A','0x0A','Completion without Data. OHC-A5 is conditional.'],['CplD','cpl','010','01010','0x4A','0x4A','Completion with Data. OHC-A5 is conditional.'],['CplLk','cpl','000','01011','0x0B','0x0B','Locked Completion without Data.'],['CplDLk','cpl','010','01011','0x4B','0x4B','Locked Completion with Data.'],['FetchAdd32','mem32','010','01100','0x4C','0x4C','AtomicOp using 32-bit address header form.'],['FetchAdd64','mem64','011','01100','0x6C','0x6C','AtomicOp using 64-bit address header form.'],['Swap32','mem32','010','01101','0x4D','0x4D','AtomicOp using 32-bit address header form.'],['Swap64','mem64','011','01101','0x6D','0x6D','AtomicOp using 64-bit address header form.'],['CAS32','mem32','010','01110','0x4E','0x4E','AtomicOp using 32-bit address header form.'],['CAS64','mem64','011','01110','0x6E','0x6E','AtomicOp using 64-bit address header form.'],['Msg','msg','001','10rrr','0x30-0x37','0x30-0x37','Message without Data; r[2:0] selects routing.'],['MsgD','msg','011','10rrr','0x70-0x77','0x70-0x77','Message with Data; r[2:0] selects routing.']
].map(x=>({name:x[0],family:x[1],fmt:x[2],type:x[3],nfm:x[4],fm:x[5],note:x[6]}));

const ohc={
'A1':{note:'Memory Requests with explicit Byte Enables and/or PASID; also Translation Requests and some Message cases.',rows:[[f('Last DW BE',31,28,'Last DWORD Byte Enable carried by OHC-A1.','FM moves this conditional boundary information out of the fixed Header Base.'),f('1st DW BE',27,24,'First DWORD Byte Enable carried by OHC-A1.','Qualifies valid bytes in the first addressed DWORD.'),f('PASID[19:0]',23,4,'Process Address Space ID.','Distinguishes process address spaces behind the same Function.'),f('NW/PV/PMR/ER',3,0,'A1 control bits.','PV qualifies PASID; PMR/ER carry privilege/execute-related semantics; NW is used by defined transaction classes.')]]},
'A2':{note:'Required for every I/O Request in Flit Mode.',rows:[[f('Last DW BE',31,28,'Last DWORD Byte Enable.','Explicit byte qualification for I/O Requests.'),f('1st DW BE',27,24,'First DWORD Byte Enable.','Defines valid starting byte lanes.'),f('Reserved',23,0,'Reserved portion of OHC-A2.','No implementation-defined data.')]]},
'A3':{note:'Required for Configuration Requests; carries Byte Enables and Destination Segment information.',rows:[[f('Last DW BE',31,28,'Last DWORD Byte Enable.','Used for sub-DWORD Configuration accesses.'),f('1st DW BE',27,24,'First DWORD Byte Enable.','Selects valid bytes in the Configuration DWORD.'),f('Destination Segment',23,16,'Destination Segment when DSV is valid.','Extends destination identity beyond BDF/BF.'),f('DSV / Reserved',15,0,'Destination Segment Valid plus reserved bits.','DSV tells whether Destination Segment participates in destination identity.')]]},
'A4':{note:'Used by ID-Routed Messages when Destination Segment and/or PASID is required.',rows:[[f('Destination Segment',31,24,'Destination PCI Segment when DSV is asserted.','Distinguishes destinations across segment domains.'),f('PASID[15:8]',23,16,'Middle PASID byte.','Part of PASID[19:0].'),f('DSV/PV/PMR/R/PASID[19:16]',15,8,'Validity/control bits plus upper PASID bits.','DSV qualifies segment; PV qualifies PASID; PMR carries privilege semantics.'),f('PASID[7:0]',7,0,'Low PASID byte.','Completes PASID[19:0].')]]},
'A5':{note:'Used by Completion when conditional status/low-address/segment information must be carried.',rows:[[f('Destination Segment',31,24,'Destination Segment when DSV is valid.','Qualifies Destination BDF/BF.'),f('Completer Segment',23,16,'Segment containing the Completer.','Carries completer segment identity when required.'),f('DSV / Reserved',15,8,'Destination Segment Valid plus reserved positions.','Controls whether Destination Segment is meaningful.'),f('LA[1:0] / Cpl Status',7,0,'Conditional low-address / Completion-status information.','Used when compact FM Completion Header Base alone is insufficient.')]]},
'B':{note:'Used for TLP Processing Hints on applicable Address-Routed Requests.',rows:[[f('Reserved',31,24,'Reserved byte.','No implementation metadata.'),f('ST[15:8]',23,16,'Upper Steering Tag byte.','Used by TPH steering semantics.'),f('ST[7:0]',15,8,'Lower Steering Tag byte.','Forms the complete Steering Tag.'),f('PH/HV/AMA/AV',7,0,'Processing Hint and validity/address-matching controls.','Carries TPH hint and related qualifiers.')]]},
'C':{note:'Used for IDE TLPs and, in applicable cases, Requester Segment information.',rows:[[f('Requester Segment',31,24,'Requester PCI Segment when valid.','Extends requester identity beyond BDF/BF.'),f('PR_Sent_Counter',23,16,'IDE/protection-related counter.','Belongs to the applicable integrity/replay-protection context.'),f('Stream_ID',15,8,'IDE Stream ID.','Selects the IDE protection context.'),f('Sub-Stream/RSV/R/K/T',7,0,'IDE sub-stream and control bits.','Carries sub-stream and validity/control semantics defined by OHC-C.')]]}
};

function layoutFor(t,fm){if(t.family==='mem32')return rowsReq(32,fm);if(t.family==='mem64')return rowsReq(64,fm);if(t.family==='io')return rowsIo(fm);if(t.family==='cfg')return rowsCfg(fm);if(t.family==='cpl')return rowsCpl(fm);return rowsMsg(fm)}
function ohcFor(t){if(t.family==='mem32'||t.family==='mem64')return['A1','B','C'];if(t.family==='io')return['A2','C'];if(t.family==='cfg')return['A3','C'];if(t.family==='cpl')return['A5','C'];return['A1','A4','B','C']}
function bitWidth(x){return x.hi-x.lo+1}
function ruler(){return `<div class="pcie-bit-ruler">${Array.from({length:32},(_,i)=>`<span>${31-i}</span>`).join('')}</div>`}
function hideDetail(){const p=$('.pcie-detail-panel');p.classList.remove('visible','arrow-bottom');p.setAttribute('aria-hidden','true');root.querySelectorAll('.pcie-field.is-active').forEach(x=>x.classList.remove('is-active'))}
function positionDetail(anchor){const panel=$('.pcie-detail-panel'),rr=root.getBoundingClientRect(),ar=anchor.getBoundingClientRect();panel.classList.add('visible');panel.setAttribute('aria-hidden','false');panel.classList.remove('arrow-bottom');const pw=panel.offsetWidth,ph=panel.offsetHeight;const anchorCenter=ar.left-rr.left+ar.width/2;let left=anchorCenter-pw/2;left=Math.max(4,Math.min(left,root.clientWidth-pw-4));const belowFits=ar.bottom+12+ph<=window.innerHeight;const aboveFits=ar.top-12-ph>=0;let top;if(!belowFits&&aboveFits){top=ar.top-rr.top-ph-12;panel.classList.add('arrow-bottom')}else{top=ar.bottom-rr.top+12}panel.style.left=`${left}px`;panel.style.top=`${top}px`;const arrowLeft=Math.max(16,Math.min(anchorCenter-left,pw-16));panel.style.setProperty('--pcie-arrow-left',`${arrowLeft}px`)}
function renderRows(el,rows,mode,t){el.innerHTML='';const table=document.createElement('div');table.className='pcie-bit-table';table.innerHTML=`<div class="pcie-bit-ruler-row"><div class="pcie-ruler-spacer"></div>${ruler()}</div>`;rows.forEach((r,i)=>{const row=document.createElement('div');row.className='pcie-dw-row';row.innerHTML=`<div class="pcie-dw-label">DW${i}</div><div class="pcie-fields"></div>`;const g=row.querySelector('.pcie-fields');r.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='pcie-field';b.style.gridColumn=`${32-x.hi} / ${33-x.lo}`;b.innerHTML=`<span class="pcie-field-name">${x.name}</span><span class="pcie-field-bits">${x.hi===x.lo?x.hi:x.hi+':'+x.lo}</span>`;b.addEventListener('click',e=>{e.stopPropagation();root.querySelectorAll('.pcie-field.is-active').forEach(y=>y.classList.remove('is-active'));b.classList.add('is-active');showDetail(`${mode} · DW${i} · ${x.name}`,x,t,b,mode,i)});g.appendChild(b)});table.appendChild(row)});el.appendChild(table)}
function showDetail(title,x,t,anchor,mode,dw){$('#pcie-detail-title').textContent=title;$('#pcie-detail-body').innerHTML=`<div class="pcie-detail-row"><div class="pcie-detail-label">Bit 位置</div><div class="pcie-detail-bits">DW${dw}[${x.hi===x.lo?x.hi:x.hi+':'+x.lo}] · ${bitWidth(x)} bit${bitWidth(x)>1?'s':''}</div></div><div class="pcie-detail-row"><div class="pcie-detail-label">作用</div><div>${x.desc}</div></div>${x.extra?`<div class="pcie-detail-extra"><div class="pcie-detail-row"><div class="pcie-detail-label">协议要点</div><div>${x.extra}</div></div></div>`:''}<div class="pcie-detail-meta">${mode} · ${t.name} · NFM ${t.nfm} → FM ${t.fm}</div>`;positionDetail(anchor)}
function renderOHC(t){const names=ohcFor(t),tabs=$('#pcie-ohc-tabs');tabs.innerHTML='';names.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent='OHC-'+n;b.addEventListener('click',e=>{e.stopPropagation();drawOHC(n,t,b)});tabs.appendChild(b);if(i===0)setTimeout(()=>drawOHC(n,t,b),0)})}
function drawOHC(n,t,btn){root.querySelectorAll('.pcie-ohc-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const o=ohc[n];$('#pcie-ohc-note').textContent=o.note;renderRows($('#pcie-ohc-layout'),o.rows,'OHC-'+n,t);hideDetail()}
function selectType(t){$('#pcie-type-summary').textContent=`NFM ${t.nfm} → FM ${t.fm} · ${t.note}`;$('#pcie-nfm-meta').textContent=`Fmt=${t.fmt}, Type=${t.type}, Byte0=${t.nfm}`;$('#pcie-fm-meta').textContent=`Type[7:0]=${t.fm}`;renderRows($('#pcie-nfm'),layoutFor(t,false),'NFM',t);renderRows($('#pcie-fm'),layoutFor(t,true),'FM',t);renderOHC(t);hideDetail()}
document.addEventListener('click',e=>{if(!root.contains(e.target)||(!e.target.closest('.pcie-field')&&!e.target.closest('.pcie-detail-panel')))hideDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideDetail()});
window.addEventListener('resize',hideDetail,{passive:true});
const sel=$('#pcie-type-select');types.forEach((t,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=t.name;sel.appendChild(o)});sel.addEventListener('change',()=>selectType(types[Number(sel.value)]));sel.value=types.findIndex(x=>x.name==='MWr64');selectType(types[Number(sel.value)]);
})();
</script>
