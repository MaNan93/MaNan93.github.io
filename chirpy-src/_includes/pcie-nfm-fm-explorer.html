<div id="pcie-field-explorer" class="pcie-field-explorer">
  <div class="pcie-explorer-toolbar">
    <label for="pcie-type-select"><strong>TLP Type</strong></label>
    <select id="pcie-type-select" aria-label="Select PCIe TLP type"></select>
    <span id="pcie-type-summary" class="pcie-type-summary"></span>
  </div>

  <div class="pcie-compare-grid">
    <section class="pcie-mode-section">
      <h4>Non-Flit Mode</h4>
      <div id="pcie-nfm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-nfm" class="pcie-layout"></div>
    </section>
    <section class="pcie-mode-section">
      <h4>Flit Mode</h4>
      <div id="pcie-fm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-fm" class="pcie-layout"></div>
    </section>
  </div>

  <section class="pcie-detail-panel" aria-live="polite" aria-hidden="true">
    <h4 id="pcie-detail-title">字段说明</h4>
    <div id="pcie-detail-body"></div>
  </section>

  <section class="pcie-ohc-section">
    <div class="pcie-ohc-head">
      <h4>Conditional OHC</h4>
      <div id="pcie-ohc-tabs" class="pcie-ohc-tabs"></div>
    </div>
    <div id="pcie-ohc-note" class="pcie-ohc-note"></div>
    <div id="pcie-ohc-layout" class="pcie-layout"></div>
  </section>
</div>

<style>
#pcie-field-explorer{position:relative;margin:1.2rem 0 2rem;font-size:.94rem;--pcie-blue-border:#7fa9c7;--pcie-blue-text:#173b55;--pcie-blue-muted:#49687e;--pcie-ruler:#b8d8ee;--pcie-ruler-border:#6f9fbe;--pcie-field:#fff;--pcie-field-hover:#f3f8fc;--pcie-field-text:#24384a;--pcie-active:#cfeecd;--pcie-active-border:#6ba66e;--pcie-active-text:#204b27;--pcie-mandatory:#edf6fc}

@media(max-width:760px){#pcie-field-explorer .pcie-bit-table,#pcie-field-explorer .pcie-na-note{min-width:650px}#pcie-field-explorer .pcie-detail-panel{width:min(410px,calc(100% - .6rem))}#pcie-field-explorer .pcie-detail-row{grid-template-columns:5rem minmax(0,1fr)}}
</style>

<script>
(()=>{
const root=document.getElementById('pcie-field-explorer'); if(!root||root.dataset.ready)return; root.dataset.ready='1';
const $=s=>root.querySelector(s);
const f=(name,hi,lo,desc,extra='')=>({name,hi,lo,desc,extra});
const commonNfm=()=>[f('Fmt',31,29,'Format field. In NFM it indicates header length and whether Data is present.','Typical values: 000b=3DW/no data, 001b=4DW/no data, 010b=3DW/with data, 011b=4DW/with data. FM folds this into Type[7:0].'),f('Type',28,24,'NFM Type[4:0]. Together with Fmt it identifies the transaction class.','Type alone is insufficient for NFM decode.'),f('T9',23,23,'Legacy Extended Tag bit 9.','Combines with T8 and Tag[7:0] when extended tags are used.'),f('TC',22,20,'Traffic Class used for QoS and TC-to-VC mapping.','It is an end-to-end transaction attribute.'),f('T8',19,19,'Legacy Extended Tag bit 8.','Together with T9 it extends Tag[7:0].'),f('Attr/LN/TH',18,16,'Overloaded NFM common-header positions for attributes and request-specific controls.','Exact meaning is transaction-dependent.'),f('TD',15,15,'TLP Digest Present.','Indicates a 32-bit ECRC digest follows the NFM TLP.'),f('EP',14,14,'Poisoned TLP indicator.','Marks associated data as unreliable while the packet remains structurally valid.'),f('Attr',13,12,'Transaction Attributes.','Carries ordering/cacheability-related semantics.'),f('AT',11,10,'Address Type for address-bearing Requests.','For Memory/Atomic address-bearing Requests this selects address interpretation/translation semantic.'),f('Length',9,0,'Payload Length in DWORD units.','Header/prefix bytes are not counted as Data Payload.')];
const commonFm=()=>[f('Type[7:0]',31,24,'Fully-decoded Flit Mode Type.','Directly selects transaction and Header Base format/size.'),f('TC',23,21,'Traffic Class in the FM Header Base.','Same semantic category as NFM TC.'),f('OHC[4:0]',20,16,'Orthogonal Header Content presence/selection field.','00000b means no OHC. When present OHC follows Header Base in A-B-C-E order.'),f('TS',15,13,'TLP Trailer Size encoding.','000b=no trailer; 001b=1DW ECRC; larger encodings select the defined reserved/IDE trailer sizes.'),f('Attr',12,10,'FM transaction Attributes.','Ordering/cacheability-related semantics.'),f('Length',9,0,'FM Data Payload Length in DWORDs.','Header Base, OHC and Trailer are not counted in this field.')];
const nfmReqId=()=>[f('Requester ID',31,16,'Function that originated the Request.','Used for routing/source identity and Completion correlation.'),f('Tag[7:0]',15,8,'Low eight bits of Request Tag.','Completion returns the matching Tag; T8/T9 may extend it in NFM.'),f('Last DW BE',7,4,'Last DWORD Byte Enable.','Qualifies byte lanes in the final DWORD.'),f('1st DW BE',3,0,'First DWORD Byte Enable.','Qualifies byte lanes in the first DWORD; FM moves explicit BE into OHC-A.')];
const fmReqId=()=>[f('Requester ID',31,16,'Requester identity in the FM Request Header Base.','Same high-level purpose as in NFM.'),f('EP',15,15,'Poisoned TLP indication.','Marks associated data as unreliable.'),f('R',14,14,'Reserved bit.','Must remain protocol-reserved.'),f('Tag[13:0]',13,0,'Fourteen-bit Request Tag carried contiguously.','Returned by Completion to identify the outstanding Request.')];
const addr32n=()=>[f('Address[31:2]',31,2,'DWORD-aligned 32-bit Request address.','Byte Enables and low-bit semantics determine the exact byte range.'),f('PH / low bits',1,0,'Low positions with request/feature-specific meaning.','May participate in Processing Hint/alignment semantics.')];
const addr32f=()=>[f('Address[31:2]',31,2,'Aligned 32-bit FM address.','Interpreted with Type, AT and relevant OHC.'),f('AT[1:0]',1,0,'FM Address Type.','In FM Memory/Atomic address routing, AT moves to the two low bits of the final Address DWORD.')];
const addr32IoFm=()=>[f('Address[31:2]',31,2,'DWORD-aligned I/O Request address.','I/O Requests use 32-bit addressing.'),f('R',1,0,'Reserved in the Flit Mode I/O Request Header Base.','Unlike FM Memory Requests, these low bits do not carry AT.')];
const addr64hi=()=>[f('Address[63:32]',31,0,'Upper half of a 64-bit Request address.','Lower aligned portion is in the following DWORD.')];
const rowsReq=(bits,fm=false)=>fm?[commonFm(),fmReqId(),...(bits===64?[addr64hi(),addr32f()]:[addr32f()])]:[commonNfm(),nfmReqId(),...(bits===64?[addr64hi(),addr32n()]:[addr32n()])];
const rowsIo=(fm=false)=>fm?[commonFm(),fmReqId(),addr32IoFm()]:[commonNfm(),nfmReqId(),addr32n()];
const rowsCfg=(fm=false)=>fm?[commonFm(),fmReqId(),[f('Destination BDF/BF',31,16,'Configuration destination Function identity.','Destination Segment qualification is carried by mandatory OHC-A3 when applicable.'),f('R',15,12,'Reserved bits in the FM Configuration Header Base.','The NFM Extended Register Number split is not retained here.'),f('Register Number',11,2,'10-bit DWORD-aligned Configuration register number.','FM represents the Configuration register number as one contiguous field.'),f('R',1,0,'Reserved low bits.','Configuration accesses are DWORD aligned.')]]:[commonNfm(),nfmReqId(),[f('Destination ID',31,16,'Legacy Configuration destination identity.','Type 0/Type 1 rules determine forwarding.'),f('R',15,12,'Reserved bits.','Not part of the register number.'),f('Ext Reg Num',11,8,'Extended Register Number bits.','Used for Extended Configuration Space.'),f('Register Number',7,2,'Configuration register DWORD number.','Byte Enables select bytes within the DWORD.'),f('R',1,0,'Reserved low bits.','Configuration accesses are DWORD aligned.')]];
const rowsCpl=(fm=false)=>fm?[commonFm(),[f('Completer ID',31,16,'Function generating the Completion.','Used for routing/debug/error attribution.'),f('EP',15,15,'Poison indication for Completion data.','For CplD it marks returned data as poisoned.'),f('LA[6]',14,14,'Upper bit of FM Completion Lower Address.','Other conditional Completion information may be carried in OHC-A5.'),f('Tag[13:0]',13,0,'Tag copied from the original Request.','Matches Completion to an outstanding Request.')],[f('Destination BDF/BF',31,16,'Destination identity corresponding to the requester.','Segment qualification may be in OHC-A5.'),f('LA[5:2]',15,12,'Middle Completion Lower Address bits.','Low bits may be supplied by OHC-A5 when applicable.'),f('Byte Count',11,0,'Bytes remaining for the Request beginning with this Completion.','Important for split read Completions.')]]:[commonNfm(),[f('Completer ID',31,16,'Function generating the Completion.','Useful for routing/debug/error attribution.'),f('Cpl Status',15,13,'Completion Status.','Reports success or defined Completion errors.'),f('BCM',12,12,'Byte Count Modified legacy control.','Normally zero in ordinary PCIe Completion flows.'),f('Byte Count',11,0,'Completion Byte Count.','Tracks remaining bytes across split Completions.')],[f('Requester ID',31,16,'Requester identity copied from the original Request.','Routes/matches the Completion back to requester.'),f('Tag[7:0]',15,8,'Low Request Tag bits.','Identifies the outstanding transaction.'),f('R',7,7,'Reserved bit.','Shown to preserve exact layout.'),f('Lower Address',6,0,'Lower byte address of first valid returned byte.','Used with Byte Count/payload length to place data correctly.')]];

function messageDw2(t){
  if(t.msgName==='Set_Slot_Power_Limit') return [f('Reserved',31,0,'Header DWORD reserved.','The Slot Power Limit Value/Scale are carried in the 1 DW Data Payload, not in this Header DWORD.')];
  return [f('Reserved / Message-specific',31,0,'Reserved or message-specific content.','For this selected Message, use the Message-specific rules rather than assuming generic payload fields.')];
}
function msgRules(t){
  const bits=[];
  if(t.msgClass==='INTx') bits.push('Conventional PCI-compatible INTx virtual-wire Message. Uses TC0; no Data; Length is Reserved.');
  if(t.msgClass==='Power Management') bits.push('Power Management Message. Uses TC0; no Data; Length is Reserved.');
  if(t.msgClass==='Error Signaling') bits.push('Error Signaling Message. Uses TC0; no Data; Length is Reserved. Requester ID identifies the reporting Function.');
  if(t.msgName==='Unlock') bits.push('Unlock Message. No Data; Length is Reserved; TC0.');
  if(t.msgName==='Set_Slot_Power_Limit') bits.push('MsgD with exactly 1 DW Data Payload; TC0. Payload Byte0[7:0]=Slot Power Limit Value and Byte1[1:0]=Slot Power Limit Scale.');
  return bits.join(' ');
}
const ecsField=()=>f('ECS',9,8,'ERR_COR Subclass.','PCIe 6.4 Table 2-25: 00=ECS Legacy; 01=ECS SIG_SFW; 10=ECS SIG_OS; 11=ECS Extended. Requesters must not use 11b; Receivers handle it internally the same as ECS SIG_OS.');

  const code=t.msgCode||'varies';

    dw1=t.msgName==='ERR_COR'?
      [f('Requester ID',31,16,'Function originating the Message.',rule),f('EP',15,15,'Reserved for Messages without data.','ERR_COR is a Msg without data, so EP is Reserved.'),f('Reserved',14,10,'Reserved bits in the ERR_COR Message header.','These bits remain Reserved.'),ecsField(),f(codeLabel,7,0,`Fixed Message Code ${code} for ${t.msgName}.`,t.msgDesc)]:
      [f('Requester ID',31,16,'Function originating the Message.',rule||'Message-specific Requester ID rules apply.'),f('EP',15,15,'Poison indication for Messages with data; Reserved for Messages without data.','PCIe 6.4 Figure 2-50.'),f('Reserved, except as noted',14,8,'Message-specific header byte; Reserved unless the selected Message definition assigns a field.','PCIe 6.4 Figure 2-50.'),f(codeLabel,7,0,`Fixed Message Code ${code} for ${t.msgName||'the selected Message'}.`,t.msgDesc||'Message Code selects the concrete Message semantic; routing is selected by Type/r[2:0].')];
  }else{
    dw1=t.msgName==='ERR_COR'?
      [f('Requester ID',31,16,'Requester identity of the Function signaling the correctable error.',rule),f('Reserved',15,10,'Reserved bits in the ERR_COR Message header.','These bits remain Reserved.'),ecsField(),f(codeLabel,7,0,`Fixed Message Code ${code} for ${t.msgName}.`,t.msgDesc)]:
      [f('Requester ID',31,16,'Requester identity of Message originator.',rule||'Message-specific Requester ID rules apply.'),f('Reserved, except as noted',15,8,'Message-specific header byte; Reserved unless the selected Message definition assigns a field.','There is no generic Message Tag field here; see PCIe 6.4 Figure 2-49.'),f(codeLabel,7,0,`Fixed Message Code ${code} for ${t.msgName||'the selected Message'}.`,t.msgDesc||'Message Code selects the concrete Message semantic; Type supplies routing.')];
  }
  return [fm?commonFm():commonNfm(),dw1,messageDw2(t),[f('Reserved / Message-specific',31,0,'Additional Message-specific or reserved DWORD.',rule||'Decode according to the selected Message definition.')]];
};
const rowsUioCpl=(withData=false)=>[commonFm(),[f('UIO Completion ID / Tag fields',31,0,'UIO Completion identity fields, including Completer identity and the 14-bit Tag.','UIO completion Transaction ID rules include TC, Requester ID and Tag. Exact sub-field split differs from legacy Cpl/CplD; see PCIe 6.2 Figures 2-83/2-84.')],[f(withData?'Destination / Lower Address / UIO Cpl fields':'Destination / UIO Cpl fields',31,0,withData?'UIORdCplD carries destination routing and the defined Lower Address / completion-specific fields.':'UIOWrCpl/UIORdCpl carry destination routing and completion-specific reserved/status fields.','Shown as a grouped DWORD here to avoid implying legacy Cpl bit positions; use PCIe 6.2 Figure 2-83/2-84 for the exact sub-field split.')]];

const baseTypes=[

function layoutFor(t,fm){if(t.family==='mem32')return rowsReq(32,fm);if(t.family==='mem64'||t.family==='uio64')return rowsReq(64,fm);if(t.family==='io')return rowsIo(fm);if(t.family==='cfg')return rowsCfg(fm);if(t.family==='cpl')return rowsCpl(fm);if(t.family==='uiocpl')return rowsUioCpl(false);if(t.family==='uiocpld')return rowsUioCpl(true);return rowsMsg(t,fm)}
function mandatoryOhcFor(t){if(t.family==='io')return'A2';if(t.family==='cfg')return'A3';return null}
function conditionalOhcFor(t){if(t.family==='mem32'||t.family==='mem64'||t.family==='uio64')return['A1','B','C'];if(t.family==='io')return['C'];if(t.family==='cfg')return['C'];if(t.family==='cpl'||t.family==='uiocpl'||t.family==='uiocpld')return['A5','C'];return['A1','A4','C']}
function conditionalNote(t,n){if(t.family==='cfg'&&n==='C')return'OHC-C is conditional here for IDE-associated Configuration Requests.';if(t.fmOnly&&n==='C')return'OHC-C is conditional for applicable segment/IDE context.';return ohc[n].note}
function bitWidth(x){return x.hi-x.lo+1}
function ruler(){return `<div class="pcie-bit-ruler">${Array.from({length:32},(_,i)=>`<span>${31-i}</span>`).join('')}</div>`}
function hideDetail(){const p=$('.pcie-detail-panel');p.classList.remove('visible','arrow-bottom');p.setAttribute('aria-hidden','true');root.querySelectorAll('.pcie-field.is-active').forEach(x=>x.classList.remove('is-active'))}
function positionDetail(anchor){const panel=$('.pcie-detail-panel'),rr=root.getBoundingClientRect(),ar=anchor.getBoundingClientRect();panel.classList.add('visible');panel.setAttribute('aria-hidden','false');panel.classList.remove('arrow-bottom');const pw=panel.offsetWidth,ph=panel.offsetHeight;const center=ar.left-rr.left+ar.width/2;let left=Math.max(4,Math.min(center-pw/2,root.clientWidth-pw-4));const below=ar.bottom+12+ph<=window.innerHeight,above=ar.top-12-ph>=0;let top;if(!below&&above){top=ar.top-rr.top-ph-12;panel.classList.add('arrow-bottom')}else top=ar.bottom-rr.top+12;panel.style.left=`${left}px`;panel.style.top=`${top}px`;panel.style.setProperty('--pcie-arrow-left',`${Math.max(16,Math.min(center-left,pw-16))}px`)}
function addFieldButtons(g,r,mode,t,loc){r.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='pcie-field';b.style.gridColumn=`${32-x.hi} / ${33-x.lo}`;b.innerHTML=`<span class="pcie-field-name">${x.name}</span><span class="pcie-field-bits">${x.hi===x.lo?x.hi:x.hi+':'+x.lo}</span>`;b.addEventListener('click',e=>{e.stopPropagation();root.querySelectorAll('.pcie-field.is-active').forEach(y=>y.classList.remove('is-active'));b.classList.add('is-active');showDetail(`${mode} · ${loc} · ${x.name}`,x,t,b,mode,loc)});g.appendChild(b)})}
function renderRows(el,rows,mode,t){el.innerHTML='';const table=document.createElement('div');table.className='pcie-bit-table';table.innerHTML=ruler();rows.forEach((r,i)=>{const row=document.createElement('div');row.className='pcie-dw-row';row.innerHTML='<div class="pcie-fields"></div>';addFieldButtons(row.querySelector('.pcie-fields'),r,mode,t,`DW${i}`);table.appendChild(row)});el.appendChild(table)}
function renderUnavailable(el,text){el.innerHTML=`<div class="pcie-na-note">${text}</div>`}
function appendMandatoryOHC(el,n,t){if(!n)return;const table=el.querySelector('.pcie-bit-table');if(!table)return;const o=ohc[n];const label=document.createElement('div');label.className='pcie-inline-ohc-label';label.innerHTML=`OHC-${n}<span class="pcie-inline-badge">Mandatory</span>`;table.appendChild(label);o.rows.forEach((r,i)=>{const row=document.createElement('div');row.className='pcie-dw-row pcie-inline-ohc-row';row.innerHTML='<div class="pcie-fields"></div>';addFieldButtons(row.querySelector('.pcie-fields'),r,`OHC-${n}`,t,o.rows.length>1?`DW${i}`:`DWORD`);table.appendChild(row)})}
function showDetail(title,x,t,anchor,mode,loc){$('#pcie-detail-title').textContent=title;const msgMeta=t.msgName?`<div class="pcie-detail-extra"><div class="pcie-detail-row"><div class="pcie-detail-label">Message</div><div>${t.msgName} · Code ${t.msgCode} · routing ${t.routing}b · ${t.msgClass}</div></div></div>`:'';$('#pcie-detail-body').innerHTML=`<div class="pcie-detail-row"><div class="pcie-detail-label">Bit 位置</div><div class="pcie-detail-bits">${loc}[${x.hi===x.lo?x.hi:x.hi+':'+x.lo}] · ${bitWidth(x)} bit${bitWidth(x)>1?'s':''}</div></div><div class="pcie-detail-row"><div class="pcie-detail-label">作用</div><div>${x.desc}</div></div>${x.extra?`<div class="pcie-detail-extra"><div class="pcie-detail-row"><div class="pcie-detail-label">协议要点</div><div>${x.extra}</div></div></div>`:''}${msgMeta}<div class="pcie-detail-meta">${mode} · ${t.name} · ${t.fmOnly?'FM-only':`NFM ${t.nfm} → FM ${t.fm}`}</div>`;positionDetail(anchor)}
function renderOHC(t){const names=conditionalOhcFor(t),tabs=$('#pcie-ohc-tabs');tabs.innerHTML='';$('#pcie-ohc-layout').innerHTML='';if(!names.length){$('#pcie-ohc-note').textContent='No additional conditional OHC for this TLP family.';return}names.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent='OHC-'+n;b.addEventListener('click',e=>{e.stopPropagation();drawOHC(n,t,b)});tabs.appendChild(b);if(i===0)setTimeout(()=>drawOHC(n,t,b),0)})}
function drawOHC(n,t,btn){root.querySelectorAll('.pcie-ohc-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const o=ohc[n];$('#pcie-ohc-note').textContent=conditionalNote(t,n);renderRows($('#pcie-ohc-layout'),o.rows,'OHC-'+n,t);hideDetail()}
function selectType(t){const mandatory=mandatoryOhcFor(t);const route=t.msgName?` · Code=${t.msgCode} · r=${t.routing}b · ${t.msgClass}`:'';$('#pcie-type-summary').textContent=t.fmOnly?`FM-only · ${t.fm} · ${t.note}`:`NFM ${t.nfm} → FM ${t.fm}${route} · ${t.note}`;if(t.fmOnly){$('#pcie-nfm-meta').textContent='No NFM encoding';renderUnavailable($('#pcie-nfm'),'UIO is defined only for Flit Mode. There is no direct Non-Flit Mode TLP encoding; UIO egress toward NFM is blocked by the UIO rules.')}else{$('#pcie-nfm-meta').textContent=`Fmt=${t.fmt}, Type=${t.type}, Byte0=${t.nfm}${t.msgName?`, Message Code=${t.msgCode}, routing=${t.routing}b`:''}`;renderRows($('#pcie-nfm'),layoutFor(t,false),'NFM',t)}$('#pcie-fm-meta').textContent=`Type[7:0]=${t.fm}${t.msgName?` · Message Code=${t.msgCode} · routing=${t.routing}b`:''}${t.fmOnly?' · PCIe 6.2 UIO · Flit-only':''}${mandatory?` · OHC-${mandatory} mandatory`:''}`;renderRows($('#pcie-fm'),layoutFor(t,true),'FM',t);appendMandatoryOHC($('#pcie-fm'),mandatory,t);renderOHC(t);hideDetail()}
document.addEventListener('click',e=>{if(!root.contains(e.target)||(!e.target.closest('.pcie-field')&&!e.target.closest('.pcie-detail-panel')))hideDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideDetail()});window.addEventListener('resize',hideDetail,{passive:true});
const sel=$('#pcie-type-select');let currentGroup='';let groupEl=null;types.forEach((t,i)=>{if(t.group!==currentGroup){currentGroup=t.group;groupEl=document.createElement('optgroup');groupEl.label=currentGroup;sel.appendChild(groupEl)}const o=document.createElement('option');o.value=String(i);o.textContent=t.name;groupEl.appendChild(o)});sel.addEventListener('change',()=>selectType(types[Number(sel.value)]));sel.value=String(types.findIndex(x=>x.name==='MWr64'));selectType(types[Number(sel.value)]);
})();
