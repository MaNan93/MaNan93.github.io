<div id="pcie-field-explorer" class="pcie-field-explorer">
  <div class="pcie-explorer-toolbar">
    <label for="pcie-type-select"><strong>TLP Type</strong></label>
    <select id="pcie-type-select" aria-label="Select PCIe TLP type"></select>
    <span id="pcie-type-summary" class="pcie-type-summary"></span>
  </div>

  <div class="pcie-compare-grid">
    <section class="pcie-mode-section pcie-nfm-section">
      <h4>Non-Flit Mode</h4>
      <div id="pcie-nfm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-nfm" class="pcie-layout"></div>
    </section>
    <section class="pcie-mode-section pcie-fm-section">
      <h4>Flit Mode</h4>
      <div id="pcie-fm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-fm" class="pcie-layout"></div>
    </section>
  </div>

  <section class="pcie-detail-panel" aria-live="polite" aria-hidden="true">
    <h4 id="pcie-detail-title">字段说明</h4>
    <div id="pcie-detail-body"></div>
  </section>

  <section class="pcie-ohc-section">
    <div class="pcie-ohc-head">
      <h4>Relevant OHC</h4>
      <div id="pcie-ohc-tabs" class="pcie-ohc-tabs"></div>
    </div>
    <div id="pcie-ohc-note" class="pcie-ohc-note"></div>
    <div id="pcie-ohc-layout" class="pcie-layout"></div>
  </section>
</div>

<style>
#pcie-field-explorer{position:relative;margin:1.2rem 0 2rem;font-size:.94rem;--pcie-blue-border:#7fa9c7;--pcie-blue-text:#173b55;--pcie-blue-muted:#49687e;--pcie-ruler:#b8d8ee;--pcie-ruler-border:#6f9fbe;--pcie-field:#ffffff;--pcie-field-hover:#f3f8fc;--pcie-field-text:#24384a;--pcie-active:#cfeecd;--pcie-active-border:#6ba66e;--pcie-active-text:#204b27}
#pcie-field-explorer .pcie-explorer-toolbar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
#pcie-field-explorer select{min-width:220px;padding:.4rem .55rem;border:1px solid var(--main-border-color,#bbb);border-radius:.45rem;background:var(--main-bg,#fff);color:inherit}
#pcie-field-explorer .pcie-type-summary{color:var(--text-muted-color,#777);font-size:.88rem}
#pcie-field-explorer .pcie-compare-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:1.6rem}
#pcie-field-explorer .pcie-compare-grid>section,#pcie-field-explorer .pcie-ohc-section{min-width:0}
#pcie-field-explorer .pcie-mode-section{min-width:0}
#pcie-field-explorer .pcie-mode-section+ .pcie-mode-section{border-top:1px solid var(--main-border-color,#ddd);padding-top:1.35rem}
#pcie-field-explorer .pcie-mode-section h4{margin-bottom:.25rem}
#pcie-field-explorer .pcie-mode-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:var(--text-muted-color,#777);margin-bottom:.55rem}
#pcie-field-explorer .pcie-layout{overflow-x:auto;padding-bottom:.25rem}
#pcie-field-explorer .pcie-dw{min-width:720px;margin:.72rem 0}
#pcie-field-explorer .pcie-dw-label{font-weight:700;margin-bottom:.18rem;font-size:.82rem}
#pcie-field-explorer .pcie-bit-ruler{display:grid;grid-template-columns:repeat(32,1fr);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.62rem;font-weight:600;color:var(--pcie-blue-text);background:var(--pcie-ruler);border:1px solid var(--pcie-ruler-border);border-bottom:0;min-height:22px;align-items:center}
#pcie-field-explorer .pcie-bit-ruler span{text-align:center;min-width:0;line-height:22px}
#pcie-field-explorer .pcie-fields{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));min-height:68px}
#pcie-field-explorer .pcie-field{appearance:none;border:1px solid var(--pcie-blue-border);border-right:0;background:var(--pcie-field);color:var(--pcie-field-text);padding:.38rem .16rem;min-width:0;overflow:hidden;cursor:pointer;text-align:center;line-height:1.15;transition:background .12s ease,box-shadow .12s ease,color .12s ease}
#pcie-field-explorer .pcie-field:last-child{border-right:1px solid var(--pcie-blue-border)}
#pcie-field-explorer .pcie-field:hover,#pcie-field-explorer .pcie-field:focus-visible{background:var(--pcie-field-hover);outline:2px solid #4b86b4;outline-offset:1px;z-index:2;box-shadow:0 2px 8px rgba(27,72,105,.15)}
#pcie-field-explorer .pcie-field.is-active{background:var(--pcie-active);color:var(--pcie-active-text);border-color:var(--pcie-active-border);outline:2px solid var(--pcie-active-border);outline-offset:1px;z-index:2;box-shadow:0 2px 10px rgba(60,120,65,.2)}
#pcie-field-explorer .pcie-field-name{display:block;font-weight:700;font-size:.8rem;white-space:normal;overflow-wrap:anywhere}
#pcie-field-explorer .pcie-field-bits{display:block;margin-top:.16rem;font-size:.66rem;color:var(--pcie-blue-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#pcie-field-explorer .pcie-field.is-active .pcie-field-bits{color:#4f7553}
#pcie-field-explorer .pcie-detail-panel{--pcie-arrow-left:24px;display:none;position:absolute;z-index:100;width:min(470px,calc(100% - 1rem));padding:.95rem 1.05rem;background:var(--main-bg,#fff);border:1px solid var(--pcie-ruler-border);border-radius:.65rem;box-shadow:0 12px 34px rgba(0,0,0,.24);color:inherit}
#pcie-field-explorer .pcie-detail-panel.visible{display:block}
#pcie-field-explorer .pcie-detail-panel h4{margin:0 0 .5rem;font-size:.98rem;color:var(--pcie-blue-text)}

#pcie-field-explorer .pcie-detail-panel::before{content:"";position:absolute;top:-7px;left:calc(var(--pcie-arrow-left) - 6px);width:12px;height:12px;background:var(--main-bg,#fff);border-left:1px solid var(--pcie-ruler-border);border-top:1px solid var(--pcie-ruler-border);transform:rotate(45deg)}
#pcie-field-explorer .pcie-detail-panel.arrow-bottom::before{top:auto;bottom:-7px;border-left:0;border-top:0;border-right:1px solid var(--pcie-ruler-border);border-bottom:1px solid var(--pcie-ruler-border)}
#pcie-field-explorer .pcie-detail-row{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.55rem;padding:.28rem 0;line-height:1.5}
#pcie-field-explorer .pcie-detail-label{font-weight:700;color:var(--pcie-blue-muted)}
#pcie-field-explorer .pcie-detail-bits{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;color:#2f75a8}
#pcie-field-explorer .pcie-detail-extra{margin-top:.42rem;padding-top:.5rem;border-top:1px solid var(--main-border-color,#ddd)}
#pcie-field-explorer .pcie-detail-meta{margin-top:.55rem;color:var(--text-muted-color,#777);font-size:.8rem}
#pcie-field-explorer .pcie-ohc-section{margin-top:1.35rem;border-top:1px solid var(--main-border-color,#ddd);padding-top:1rem}
#pcie-field-explorer .pcie-ohc-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
#pcie-field-explorer .pcie-ohc-head h4{margin:0}
#pcie-field-explorer .pcie-ohc-tabs{display:flex;gap:.35rem;flex-wrap:wrap}
#pcie-field-explorer .pcie-ohc-tabs button{border:1px solid var(--pcie-blue-border);background:var(--pcie-field);color:var(--pcie-field-text);border-radius:999px;padding:.25rem .58rem;cursor:pointer;font-size:.78rem}
#pcie-field-explorer .pcie-ohc-tabs button:hover{background:var(--pcie-field-hover)}
#pcie-field-explorer .pcie-ohc-tabs button.active{background:var(--pcie-active);color:var(--pcie-active-text);border-color:var(--pcie-active-border)}
#pcie-field-explorer .pcie-ohc-note{margin:.5rem 0 .7rem;color:var(--text-muted-color,#777);font-size:.86rem}
html[data-mode="dark"] #pcie-field-explorer{--pcie-blue-border:#5f8eae;--pcie-blue-text:#eef7fc;--pcie-blue-muted:#c2dbea;--pcie-ruler:#326584;--pcie-ruler-border:#77a9c8;--pcie-field:#1f242b;--pcie-field-hover:#29313a;--pcie-field-text:#e8eef4;--pcie-active:#315b38;--pcie-active-border:#6fa879;--pcie-active-text:#f0fff2}
html[data-mode="dark"] #pcie-field-explorer .pcie-field.is-active .pcie-field-bits{color:#c7e7cc}
html[data-mode="dark"] #pcie-field-explorer .pcie-detail-bits{color:#8fc7ed}
@media(max-width:760px){#pcie-field-explorer .pcie-dw{min-width:640px}#pcie-field-explorer .pcie-detail-panel{width:min(390px,calc(100% - .6rem))}#pcie-field-explorer .pcie-detail-row{grid-template-columns:4.8rem minmax(0,1fr)}}
</style>

<script>
(()=>{
const root=document.getElementById('pcie-field-explorer'); if(!root||root.dataset.ready)return; root.dataset.ready='1';
const $=s=>root.querySelector(s);
const f=(name,hi,lo,desc,extra='')=>({name,hi,lo,desc,extra});
const commonNfm=()=>[
  f('Fmt',31,29,'Format field. In Non-Flit Mode this field participates in the primary TLP decode and tells the receiver whether the base header is 3DW or 4DW and whether a Data Payload is present.','Typical values are 000b=3DW/no data, 001b=4DW/no data, 010b=3DW/with data and 011b=4DW/with data. Flit Mode removes the independent Fmt field; the corresponding format semantic is encoded by Type[7:0] and the selected Header Base format.'),
  f('Type',28,24,'Non-Flit Mode Type[4:0]. Together with Fmt it identifies the transaction class and determines how the remaining Header DWORDs are decoded.','For example, Memory Requests use Type=00000b, Completions use 01010b, and legacy Message encodings include routing information in Type. In NFM, Type alone is therefore insufficient to determine the complete TLP format.'),
  f('T9',23,23,'Tag bit 9. One of the legacy Extended Tag bits used to enlarge the request Tag beyond Tag[7:0].','When the applicable Extended Tag capability is enabled, T9 combines with T8 and Tag[7:0]. The returned Completion uses the matching Tag so the requester can identify the outstanding non-posted Request. FM instead carries the expanded Tag contiguously as Tag[13:0].'),
  f('TC',22,20,'Traffic Class. Identifies the transaction Traffic Class used by PCIe QoS and Traffic-Class-to-Virtual-Channel mapping.','TC is part of the end-to-end transaction attributes. It affects VC selection/service policy but does not by itself change the TLP payload or address.'),
  f('T8',19,19,'Tag bit 8, the other legacy Extended Tag bit adjacent to the common control fields.','T8 and T9 extend Tag[7:0] in NFM. FM reorganizes the Tag into one contiguous field, which simplifies parser and request/completion matching logic.'),
  f('Attr/LN/TH',18,16,'Overloaded portion of the NFM common header. Depending on TLP type and enabled features, these bit positions carry transaction Attributes and request-specific control semantics such as LN or TH.','The exact meaning is transaction-dependent. This is a useful example of why FM separates the compact Header Base from orthogonal optional information in OHC.'),
  f('TD',15,15,'TLP Digest Present. When set in NFM, a 32-bit End-to-End CRC (ECRC) digest follows the TLP.','TD belongs to the legacy ECRC/TLP Digest mechanism. It should not be confused with the Flit Mode trailer mechanism selected through TS.'),
  f('EP',14,14,'Poisoned TLP indicator. It marks the transaction data as known-bad or unreliable while keeping the packet structurally valid.','For data-bearing Requests or Completions, EP propagates poisoned-data semantics into the receiver/error-reporting path. EP=1 is not itself a malformed-packet indication.'),
  f('Attr',13,12,'Transaction Attribute bits. They carry ordering/cacheability-related semantics defined for the selected transaction type.','Depending on the TLP and revision, attributes include behaviors such as Relaxed Ordering and No Snoop. FM keeps the same category of semantic information but places the field contiguously in the common Header Base.'),
  f('AT',11,10,'Address Type for address-bearing Requests. It selects the interpretation/translation semantic applied to the address.','AT is meaningful only for TLP formats that define it. The Request type, address field and AT value must be interpreted together.'),
  f('Length',9,0,'Length field. For data-bearing TLPs it describes the Data Payload length in DWORD units according to PCIe Length encoding rules.','Header and prefix bytes are not counted as Data Payload. Special Length encodings follow the Base Specification rules and should not be interpreted as a simple unsigned byte count.')
];
const commonFm=()=>[
  f('Type[7:0]',31,24,'Fully-decoded Flit Mode TLP Type. It directly identifies the transaction and selects the corresponding Header Base format and size.','FM has no independent Fmt field. Type[7:0] therefore carries both transaction identity and the format selection that used to be distributed across Fmt+Type. Many legacy encodings retain their hexadecimal value, while MRd32 is a notable remap because FM 0x00 is NOP.'),
  f('TC',23,21,'Traffic Class in the FM common Header Base. It preserves the end-to-end Traffic Class used for QoS and VC mapping.','The semantic category is the same as NFM TC, but the bit position changes because the FM common header has been reorganized.'),
  f('OHC[4:0]',20,16,'Orthogonal Header Content indication. It tells the receiver which additional OHC blocks follow the Header Base.','OHC carries information that is not needed in every instance of a transaction type: Byte Enables, PASID, segment identity, TPH information, IDE context, or conditional Completion information. A parser first decodes Type/Header Base, then consumes the indicated OHC blocks in protocol-defined order.'),
  f('TS',15,13,'TLP Trailer Size / trailer-related indication in Flit Mode.','TS tells the receiver how much trailer information belongs to this TLP. It is part of the FM trailer mechanism and is not equivalent to the legacy single TD bit.'),
  f('Attr',12,10,'FM transaction Attributes. These bits carry ordering/cacheability-related semantics for the selected Type.','Compared with NFM, the attribute encoding is placed contiguously in the common Header Base rather than split across legacy positions.'),
  f('Length',9,0,'Data Payload Length in DWORD units for the FM TLP types that carry data.','The Length field describes payload data only; Header Base, OHC and TLP Trailer are accounted for separately when determining the complete TLP size.')
];
const nfmReqId=()=>[
  f('Requester ID',31,16,'Identifies the Function that originated the Request. In conventional PCIe identity form this corresponds to the requester Bus/Device/Function information.','The identity is used for routing and for associating returned Completions with the originating Function. ARI and segment-aware cases modify how Function identity is interpreted, but the purpose remains requester identification.'),
  f('Tag[7:0]',15,8,'Low eight bits of the Request Tag. The requester allocates a Tag so multiple non-posted Requests can be outstanding at the same time.','A Completion returns the matching Tag, allowing the requester to find the corresponding request context. In NFM the full extended Tag may also use T8/T9; FM instead carries Tag[13:0] contiguously.'),
  f('Last DW BE',7,4,'Last DWORD Byte Enable. It identifies which byte lanes are valid in the final DWORD covered by the Request.','Together with First DW BE it represents byte granularity at the beginning and end of a transfer. Rules differ for single-DW and multi-DW accesses. In FM this information moves to the applicable OHC-A format when it must be explicitly carried.'),
  f('1st DW BE',3,0,'First DWORD Byte Enable. It identifies which byte lanes are valid in the first addressed DWORD.','This field is important for sub-DWORD accesses and unaligned byte ranges. FM removes it from the fixed Request Header Base and carries explicit Byte Enables through OHC-A1/A2/A3 depending on the request family.')
];
const fmReqId=()=>[
  f('Requester ID',31,16,'Requester identity in the FM Request Header Base. It identifies the Function that originated the Request.','Its high-level role remains routing/source identity and request/completion correlation, although the surrounding bit layout is reorganized compared with NFM.'),
  f('EP',15,15,'Poisoned TLP indication for the FM Request.','EP indicates that the data associated with the transaction is known to be unreliable while the TLP itself remains structurally valid.'),
  f('R',14,14,'Reserved bit. It exists to preserve the protocol-defined layout and has no transaction semantic assigned to it.','Transmit and receive handling must follow the Base Specification reserved-bit rules; implementations should not reuse it for private metadata.'),
  f('Tag[13:0]',13,0,'Fourteen-bit Request Tag carried contiguously in the FM Header Base.','The Tag identifies an outstanding Request and is returned by the corresponding Completion. Compared with NFM Tag[7:0]+T8+T9, the FM representation provides a larger contiguous tag space and simpler decode.')
];
const addr32n=()=>[
  f('Address[31:2]',31,2,'DWORD-aligned portion of a 32-bit Request address. The two least-significant address bits are not carried as ordinary address bits in this format.','Byte Enable and request-specific low-bit semantics determine the exact byte range. The field is interpreted together with the selected transaction type.'),
  f('PH / low bits',1,0,'Low two positions of the legacy 32-bit Memory Request address DWORD. Their meaning is transaction/feature dependent rather than simply Address[1:0].','For applicable requests these positions participate in Processing Hint or alignment-related semantics. Use the exact per-TLP format when decoding them.')
];
const addr32f=()=>[
  f('Address[31:2]',31,2,'Aligned portion of the 32-bit address in the FM Header Base.','Together with Type, AT and any relevant OHC, this field identifies the target address and the way the address should be interpreted.'),
  f('AT[1:0]',1,0,'Address Type in the FM address DWORD. It selects the protocol-defined address interpretation/translation semantic.','Because the address is naturally aligned, these two low bit positions can carry AT rather than literal Address[1:0].')
];
const addr64hi=()=>[
  f('Address[63:32]',31,0,'Upper 32 bits of a 64-bit Request address.','The lower address portion is carried in the following Header DWORD. The two DWORDs together form the complete 64-bit address used by the transaction.')
];
const rowsReq=(bits,fm=false)=>fm?[commonFm(),fmReqId(),...(bits===64?[addr64hi(),addr32f()]:[addr32f()])]:[commonNfm(),nfmReqId(),...(bits===64?[addr64hi(),addr32n()]:[addr32n()])];
const rowsIo=(fm=false)=>fm?[commonFm(),fmReqId(),addr32f()]:[commonNfm(),nfmReqId(),addr32n()];
const rowsCfg=(fm=false)=>fm?[
  commonFm(),fmReqId(),[
    f('Destination BDF/BF',31,16,'Identifies the target Function for the Configuration Request in the FM Configuration Header Base.','The destination identity is interpreted according to the applicable BDF/BF and hierarchy/ARI rules. Segment qualification, when needed, is carried separately in OHC-A3.'),
    f('Ext Reg Num',15,12,'Upper portion of the Configuration Register Number used for extended Configuration Space.','It combines with Register Number to select the addressed Configuration DWORD beyond the original 256-byte Configuration Space range.'),
    f('Register Number',11,2,'DWORD-aligned Configuration register number.','The low byte positions are not part of the register number because Configuration accesses are DWORD-oriented; sub-DWORD byte selection is expressed by Byte Enables in OHC-A3.'),
    f('R',1,0,'Reserved bits in the FM Configuration Header Base.','They have no transaction semantic and must be handled according to the reserved-bit rules.')
  ]
]:[
  commonNfm(),nfmReqId(),[
    f('Destination ID',31,16,'Destination Bus/Device/Function identity for the legacy Configuration Request.','Type 0 and Type 1 Configuration routing determine how bridges forward this identity and where the request is finally consumed.'),
    f('R',15,12,'Reserved bits in the legacy Configuration address DWORD.','They do not contribute to the Configuration Register Number.'),
    f('Ext Reg Num',11,8,'Extended Register Number bits for Configuration Space beyond the original 256-byte region.','These bits combine with Register Number to address the PCIe Extended Configuration Space.'),
    f('Register Number',7,2,'Configuration register DWORD number.','First DW Byte Enable in DW1 determines which bytes within the addressed Configuration DWORD are accessed.'),
    f('R',1,0,'Reserved low bits.','Configuration accesses are DWORD aligned, so byte-granularity selection is represented by Byte Enables rather than these positions.')
  ]
];
const rowsCpl=(fm=false)=>fm?[
  commonFm(),[
    f('Completer ID',31,16,'Identifies the Function that generated the Completion.','It lets the receiver attribute the response to the completer and is useful for routing, debug and error reporting.'),
    f('EP',15,15,'Poison indication for Completion data.','For CplD, EP tells the requester that returned data is poisoned. The Completion can remain structurally valid while its payload is marked unreliable.'),
    f('LA[6]',14,14,'Bit 6 of the Completion Lower Address represented directly in the FM Header Base.','The remaining Lower Address information is distributed across the FM Completion format and, when required, OHC-A5.'),
    f('Tag[13:0]',13,0,'Tag copied from the original Request.','The requester uses this value to match the Completion to the corresponding outstanding request context. FM supports the expanded contiguous Tag directly in the Header Base.')
  ],[
    f('Destination BDF/BF',31,16,'Destination identity corresponding to the original Requester.','This is the FM Completion routing identity used to return the response to the requesting Function; segment qualification can be carried through OHC-A5 when required.'),
    f('LA[5:2]',15,12,'Middle portion of the Completion Lower Address.','Lower Address identifies the first valid returned byte. Low address/status information that is conditionally needed is carried by OHC-A5.'),
    f('Byte Count',11,0,'Number of bytes remaining for the Request beginning with this Completion, according to PCIe Completion Byte Count rules.','For split read Completions it allows the requester to determine how much data remains; it is not merely the current CplD payload length.')
  ]
]:[
  commonNfm(),[
    f('Completer ID',31,16,'Identifies the Function that generated the Completion.','This identity is returned by the completer and is used for routing/debug/error attribution.'),
    f('Cpl Status',15,13,'Completion Status reports whether the Request completed successfully or terminated with a defined error status.','Defined status values include Successful Completion, Unsupported Request and Completer Abort, with exact encodings and legal use defined by the Base Specification.'),
    f('BCM',12,12,'Byte Count Modified. A legacy Completion control used only by the specific cases defined by PCIe.','BCM is normally zero for ordinary PCIe Completion flows and should not be treated as a generic Byte Count valid bit.'),
    f('Byte Count',11,0,'Completion Byte Count gives the remaining byte count associated with the Request from this Completion onward.','This is critical when a large Memory Read is returned through multiple Completion TLPs, because it lets the requester track progress across split responses.')
  ],[
    f('Requester ID',31,16,'Requester identity copied from the original Request so the Completion can be routed and matched back to the originating Function.','The Completion preserves the requester identity until it reaches the Requester.'),
    f('Tag[7:0]',15,8,'Low eight bits of the original Request Tag.','Together with any applicable extended Tag bits, it lets the Requester locate the corresponding outstanding transaction state.'),
    f('R',7,7,'Reserved bit in the legacy Completion Header.','It is shown explicitly because its position affects the surrounding Tag and Lower Address fields.'),
    f('Lower Address',6,0,'Lower byte address of the first valid byte returned by the Completion.','Together with Byte Count and payload length, this allows returned data to be placed correctly, especially when a Request is split across multiple Completions.')
  ]
];
const rowsMsg=(fm=false)=>fm?[
  commonFm(),[
    f('Requester ID',31,16,'Identifies the Function originating the Message.','Message definitions that need source identity use this field for attribution or routing semantics.'),
    f('EP',15,15,'Poison indication when the Message semantics permit poisoned data handling.','For MsgD, EP can qualify the associated data payload.'),
    f('R',14,8,'Reserved area in the generic FM Message Header Base.','Generic reserved positions remain reserved; Message-specific data is carried only where the selected Message definition or OHC assigns it.'),
    f('Message Code',7,0,'Identifies the specific Message semantic inside the broader Message routing/type class.','Routing is selected by the Message Type/routing encoding, while Message Code distinguishes the actual protocol message such as power-management, error, vendor-defined or other defined messages.')
  ],[
    f('Message-specific / Reserved',31,0,'DWORD whose exact meaning is selected by Message Code.','There is no universal decomposition for this DWORD because different Message definitions assign different fields or require the entire DWORD to remain reserved.')
  ],[
    f('Message-specific / Reserved',31,0,'Additional Message-specific or reserved DWORD.','Decode this DWORD only according to the selected Message Code definition; otherwise treat protocol-defined reserved positions as reserved.')
  ]
]:[
  commonNfm(),[
    f('Requester ID',31,16,'Requester identity of the Message originator.','Used by Message definitions that require the source Function to be identified.'),
    f('Tag',15,8,'Legacy Message Tag field where defined by the Message format.','Its exact use is Message-specific; unlike Memory Read Request tags, not every Message uses request/completion matching semantics.'),
    f('Message Code',7,0,'Selects the concrete Message semantic.','The legacy Type field determines the Message routing class, while Message Code specifies which protocol message is carried.')
  ],[
    f('Message-specific / Reserved',31,0,'Message-specific or reserved DWORD.','The exact field split depends on Message Code, so this family-level view intentionally leaves the DWORD generic.')
  ],[
    f('Message-specific / Reserved',31,0,'Additional Message-specific or reserved DWORD.','Use the individual Message definition for exact bit assignments and reserved-bit requirements.')
  ]
];
const types=[

const ohc={
'A1':{note:'Memory Requests with explicit Byte Enables and/or PASID; also Translation Requests and some Address-Routed/RC-directed Messages with PASID.',rows:[[f('Last DW BE',31,28,'Last DWORD Byte Enable carried by OHC-A1.','It qualifies valid bytes in the final DWORD when the FM Request requires explicit Byte Enables. This is the OHC form of information that occupied fixed header positions in NFM.'),f('1st DW BE',27,24,'First DWORD Byte Enable carried by OHC-A1.','It qualifies valid bytes in the first addressed DWORD. Moving BE into OHC keeps the FM Request Header Base compact when byte enables are not needed.'),f('PASID[19:0]',23,4,'Process Address Space ID associated with the transaction.','PASID distinguishes process address spaces behind the same PCIe Function and is interpreted together with PV/PMR/ER controls.'),f('NW/PV/PMR/ER',3,0,'Control bits associated with the OHC-A1 format.','PV qualifies PASID presence; PMR/ER describe privilege/execute semantics; NW is used by the transaction classes explicitly defined to support it, such as Translation-related Requests.')]]},
'A2':{note:'Required for every I/O Request in Flit Mode.',rows:[[f('Last DW BE',31,28,'Last DWORD Byte Enable for the I/O Request.','I/O Requests require explicit byte qualification, so FM carries these enables in mandatory OHC-A2.'),f('1st DW BE',27,24,'First DWORD Byte Enable for the I/O Request.','It defines which byte lanes of the addressed I/O DWORD participate in the transaction.'),f('Reserved',23,0,'Reserved portion of OHC-A2.','These positions do not carry implementation-specific information and must follow reserved-bit transmit/receive rules.')]]},
'A3':{note:'Required for Configuration Requests; carries Byte Enables and Destination Segment information.',rows:[[f('Last DW BE',31,28,'Last DWORD Byte Enable for the Configuration Request.','Configuration transactions use byte enables for sub-DWORD Configuration register accesses.'),f('1st DW BE',27,24,'First DWORD Byte Enable for the Configuration Request.','It determines which bytes of the addressed Configuration DWORD participate in the operation.'),f('Destination Segment',23,16,'Destination PCI Segment number when DSV indicates it is valid.','It extends destination identity beyond the BDF/BF carried in the FM Configuration Header Base.'),f('DSV / Reserved',15,0,'Destination Segment Valid plus reserved positions.','DSV tells the receiver whether Destination Segment participates in the destination identity; all remaining reserved positions keep their protocol-defined values.')]]},
'A4':{note:'Used by ID-Routed Messages when Destination Segment and/or PASID is required.',rows:[[f('Destination Segment',31,24,'PCI Segment of the Message destination when DSV is asserted.','This lets ID-Routed Messages distinguish otherwise identical destination BDF/BF identities located in different segments.'),f('PASID[15:8]',23,16,'Middle byte of PASID.','This slice combines with the upper/lower PASID slices to form the complete Process Address Space ID.'),f('DSV/PV/PMR/R/PASID[19:16]',15,8,'Validity/control bits plus upper PASID bits.','DSV qualifies Destination Segment; PV qualifies PASID; PMR carries privilege semantics; reserved positions retain reserved behavior.'),f('PASID[7:0]',7,0,'Low byte of PASID.','Together with the other PASID slices this forms PASID[19:0] for the Message transaction.')]]},
'A5':{note:'Required for unsuccessful Completions, for Non-UIO Completions with LA[1:0] != 00b, and when explicit segment information is required.',rows:[[f('Destination Segment',31,24,'PCI Segment of the Completion destination when DSV is set.','It qualifies Destination BDF/BF from the FM Completion Header Base when segment-level identity is required.'),f('Completer Segment',23,16,'PCI Segment containing the Completer.','This carries completer segment identity that is omitted from the compact Header Base when it is not needed.'),f('DSV / Reserved',15,8,'Destination Segment Valid plus reserved positions.','DSV determines whether Destination Segment contributes to completion routing identity.'),f('LA[1:0] / Cpl Status',7,0,'Conditional Completion information containing low Lower-Address/status semantics as defined by OHC-A5.','OHC-A5 is used when these fields cannot be omitted from the compact FM Completion Header Base, notably unsuccessful Completion cases or cases that require the low address/segment information.')]]},
'B':{note:'Used for TLP Processing Hints on applicable Address-Routed Requests.',rows:[[f('Reserved',31,24,'Reserved byte in OHC-B.','It is not payload or implementation metadata.'),f('ST[15:8]',23,16,'Upper byte of the TPH Steering Tag.','The Steering Tag helps the platform steer/cache/process the Request according to TLP Processing Hint semantics.'),f('ST[7:0]',15,8,'Lower byte of the TPH Steering Tag.','It combines with ST[15:8] to form the complete Steering Tag.'),f('PH/HV/AMA/AV',7,0,'Processing Hint and associated validity/address-matching controls.','PH carries the hint itself; HV/AV qualify defined fields; AMA participates in the TPH address-matching semantic.')]]},
'C':{note:'Required for IDE TLPs; also used in some non-IDE cases to carry Requester Segment information.',rows:[[f('Requester Segment',31,24,'PCI Segment containing the Requester when the Requester Segment Valid control indicates it is present.','This extends requester identity when BDF/BF alone is not sufficient to identify the source across segments.'),f('PR_Sent_Counter',23,16,'IDE/protection-related counter field used by the applicable integrity/replay-protection mechanism.','It belongs to the IDE protection context rather than ordinary request ordering or Completion matching.'),f('Stream_ID',15,8,'IDE Stream ID selecting the Integrity and Data Encryption stream context.','IDE-capable components use Stream_ID to apply the correct security/protection association to the TLP.'),f('Sub-Stream/RSV/R/K/T',7,0,'IDE sub-stream plus associated validity/control bits.','These bits identify the protected sub-stream and carry Requester Segment Valid and other OHC-C controls defined by the IDE rules.')]]}

function layoutFor(t,fm){if(t.family==='mem32')return rowsReq(32,fm);if(t.family==='mem64')return rowsReq(64,fm);if(t.family==='io')return rowsIo(fm);if(t.family==='cfg')return rowsCfg(fm);if(t.family==='cpl')return rowsCpl(fm);return rowsMsg(fm)}
function ohcFor(t){if(t.family==='mem32'||t.family==='mem64')return['A1','B','C'];if(t.family==='io')return['A2','C'];if(t.family==='cfg')return['A3','C'];if(t.family==='cpl')return['A5','C'];return['A1','A4','B','C']}
function bitsText(x){return x.hi===x.lo?`bit ${x.hi}`:`bits ${x.hi}:${x.lo}`}
function bitWidth(x){return x.hi-x.lo+1}
function ruler(){return `<div class="pcie-bit-ruler">${Array.from({length:32},(_,i)=>`<span>${31-i}</span>`).join('')}</div>`}
function hideDetail(){const p=$('.pcie-detail-panel');p.classList.remove('visible','arrow-bottom');p.setAttribute('aria-hidden','true');root.querySelectorAll('.pcie-field.is-active').forEach(x=>x.classList.remove('is-active'))}
function positionDetail(anchor){
  const panel=$('.pcie-detail-panel'),rr=root.getBoundingClientRect(),ar=anchor.getBoundingClientRect();
  panel.classList.add('visible');panel.setAttribute('aria-hidden','false');
  panel.classList.remove('arrow-bottom');
  const pw=panel.offsetWidth,ph=panel.offsetHeight;
  const anchorCenter=ar.left-rr.left+(ar.width/2);
  let left=anchorCenter-(pw/2);
  left=Math.max(4,Math.min(left,root.clientWidth-pw-4));
  const belowViewportFits=(ar.bottom+12+ph)<=window.innerHeight;
  const aboveViewportFits=(ar.top-12-ph)>=0;
  let top;
  if(!belowViewportFits&&aboveViewportFits){top=ar.top-rr.top-ph-12;panel.classList.add('arrow-bottom')}else{top=ar.bottom-rr.top+12}
  panel.style.left=`${left}px`;panel.style.top=`${top}px`;
  const arrowLeft=Math.max(16,Math.min(anchorCenter-left,pw-16));
  panel.style.setProperty('--pcie-arrow-left',`${arrowLeft}px`);
}
function renderRows(el,rows,mode,t){el.innerHTML='';rows.forEach((r,i)=>{const wrap=document.createElement('div');wrap.className='pcie-dw';wrap.innerHTML=`<div class="pcie-dw-label">DW${i}</div>${ruler()}<div class="pcie-fields"></div>`;const g=wrap.querySelector('.pcie-fields');r.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='pcie-field';b.style.gridColumn=`${32-x.hi} / ${33-x.lo}`;b.innerHTML=`<span class="pcie-field-name">${x.name}</span><span class="pcie-field-bits">${x.hi===x.lo?x.hi:x.hi+':'+x.lo}</span>`;b.addEventListener('click',e=>{e.stopPropagation();root.querySelectorAll('.pcie-field.is-active').forEach(y=>y.classList.remove('is-active'));b.classList.add('is-active');showDetail(`${mode} · DW${i} · ${x.name}`,x,t,b,mode,i)});g.appendChild(b)});el.appendChild(wrap)})}
function showDetail(title,x,t,anchor,mode,dw){$('#pcie-detail-title').textContent=title;$('#pcie-detail-body').innerHTML=`<div class="pcie-detail-row"><div class="pcie-detail-label">Bit 位置</div><div class="pcie-detail-bits">DW${dw}[${x.hi===x.lo?x.hi:x.hi+':'+x.lo}] · ${bitWidth(x)} bit${bitWidth(x)>1?'s':''}</div></div><div class="pcie-detail-row"><div class="pcie-detail-label">作用</div><div>${x.desc}</div></div>${x.extra?`<div class="pcie-detail-extra"><div class="pcie-detail-row"><div class="pcie-detail-label">协议要点</div><div>${x.extra}</div></div></div>`:''}<div class="pcie-detail-meta">${mode} · ${t.name} · NFM ${t.nfm} → FM ${t.fm}</div>`;positionDetail(anchor)}
function renderOHC(t){const names=ohcFor(t),tabs=$('#pcie-ohc-tabs');tabs.innerHTML='';names.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent='OHC-'+n;b.addEventListener('click',e=>{e.stopPropagation();drawOHC(n,t,b)});tabs.appendChild(b);if(i===0)setTimeout(()=>drawOHC(n,t,b),0)})}
function drawOHC(n,t,btn){root.querySelectorAll('.pcie-ohc-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const o=ohc[n];$('#pcie-ohc-note').textContent=o.note;renderRows($('#pcie-ohc-layout'),o.rows,'OHC-'+n,t);hideDetail()}
function selectType(t){$('#pcie-type-summary').textContent=`NFM ${t.nfm}  →  FM ${t.fm} · ${t.note}`;$('#pcie-nfm-meta').textContent=`Fmt=${t.fmt}, Type=${t.type}, Byte0=${t.nfm}`;$('#pcie-fm-meta').textContent=`Type[7:0]=${t.fm}`;renderRows($('#pcie-nfm'),layoutFor(t,false),'NFM',t);renderRows($('#pcie-fm'),layoutFor(t,true),'FM',t);renderOHC(t);hideDetail()}
document.addEventListener('click',e=>{if(!root.contains(e.target)||(!e.target.closest('.pcie-field')&&!e.target.closest('.pcie-detail-panel'))){hideDetail()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideDetail()});
window.addEventListener('resize',hideDetail,{passive:true});
const sel=$('#pcie-type-select');types.forEach((t,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=t.name;sel.appendChild(o)});sel.addEventListener('change',()=>selectType(types[Number(sel.value)]));sel.value=types.findIndex(x=>x.name==='MWr64');selectType(types[Number(sel.value)]);
})();
</script>
