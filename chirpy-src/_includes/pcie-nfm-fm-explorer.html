<div id="pcie-field-explorer" class="pcie-field-explorer">
  <div class="pcie-explorer-toolbar">
    <label for="pcie-type-select"><strong>TLP Type</strong></label>
    <select id="pcie-type-select" aria-label="Select PCIe TLP type"></select>
    <span id="pcie-type-summary" class="pcie-type-summary"></span>
  </div>

  <div class="pcie-compare-grid">
    <section class="pcie-mode-section pcie-nfm-section">
      <h4>Non-Flit Mode</h4>
      <div id="pcie-nfm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-nfm" class="pcie-layout"></div>
    </section>
    <section class="pcie-mode-section pcie-fm-section">
      <h4>Flit Mode</h4>
      <div id="pcie-fm-meta" class="pcie-mode-meta"></div>
      <div id="pcie-fm" class="pcie-layout"></div>
    </section>
  </div>

  <section class="pcie-detail-panel" aria-live="polite" aria-hidden="true">
    <h4 id="pcie-detail-title">字段说明</h4>
    <div id="pcie-detail-body"></div>
  </section>

  <section class="pcie-ohc-section">
    <div class="pcie-ohc-head">
      <h4>Relevant OHC</h4>
      <div id="pcie-ohc-tabs" class="pcie-ohc-tabs"></div>
    </div>
    <div id="pcie-ohc-note" class="pcie-ohc-note"></div>
    <div id="pcie-ohc-layout" class="pcie-layout"></div>
  </section>
</div>

<style>
#pcie-field-explorer{position:relative;margin:1.2rem 0 2rem;font-size:.94rem;--pcie-control:#dceafe;--pcie-id:#e5ddfb;--pcie-address:#daf2df;--pcie-length:#fff0bf;--pcie-be:#ffd9d9;--pcie-msg:#ffe3c7;--pcie-extra:#d8edf0;--pcie-reserved:#eceff3;--pcie-neutral:#eaf0f7}
#pcie-field-explorer .pcie-explorer-toolbar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
#pcie-field-explorer select{min-width:220px;padding:.4rem .55rem;border:1px solid var(--main-border-color,#bbb);border-radius:.45rem;background:var(--main-bg,#fff);color:inherit}
#pcie-field-explorer .pcie-type-summary{color:var(--text-muted-color,#777);font-size:.88rem}
#pcie-field-explorer .pcie-compare-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:1.6rem}
#pcie-field-explorer .pcie-compare-grid>section,#pcie-field-explorer .pcie-ohc-section{min-width:0}
#pcie-field-explorer .pcie-mode-section{min-width:0}
#pcie-field-explorer .pcie-mode-section+ .pcie-mode-section{border-top:1px solid var(--main-border-color,#ddd);padding-top:1.35rem}
#pcie-field-explorer .pcie-mode-section h4{margin-bottom:.25rem}
#pcie-field-explorer .pcie-mode-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:var(--text-muted-color,#777);margin-bottom:.55rem}
#pcie-field-explorer .pcie-layout{overflow-x:auto;padding-bottom:.25rem}
#pcie-field-explorer .pcie-dw{min-width:720px;margin:.72rem 0}
#pcie-field-explorer .pcie-dw-label{font-weight:700;margin-bottom:.18rem;font-size:.82rem}
#pcie-field-explorer .pcie-bit-ruler{display:grid;grid-template-columns:repeat(32,1fr);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.61rem;color:var(--text-muted-color,#777);margin-left:0}
#pcie-field-explorer .pcie-bit-ruler span{text-align:center;min-width:0}
#pcie-field-explorer .pcie-fields{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));min-height:68px}
#pcie-field-explorer .pcie-field{appearance:none;border:1px solid color-mix(in srgb,var(--main-border-color,#aaa) 80%,transparent);border-right:0;background:var(--pcie-neutral);color:#263241;padding:.38rem .16rem;min-width:0;overflow:hidden;cursor:pointer;text-align:center;line-height:1.15;transition:filter .12s ease,transform .12s ease,box-shadow .12s ease}
#pcie-field-explorer .pcie-field:last-child{border-right:1px solid color-mix(in srgb,var(--main-border-color,#aaa) 80%,transparent)}
#pcie-field-explorer .pcie-field:hover,#pcie-field-explorer .pcie-field:focus-visible{filter:brightness(.96);outline:2px solid var(--link-color,#4a78c2);outline-offset:1px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#pcie-field-explorer .pcie-field.is-active{outline:2px solid var(--link-color,#4a78c2);outline-offset:1px;z-index:2;filter:saturate(1.15)}
#pcie-field-explorer .pcie-field--control{background:var(--pcie-control)}
#pcie-field-explorer .pcie-field--id{background:var(--pcie-id)}
#pcie-field-explorer .pcie-field--address{background:var(--pcie-address)}
#pcie-field-explorer .pcie-field--length{background:var(--pcie-length)}
#pcie-field-explorer .pcie-field--be{background:var(--pcie-be)}
#pcie-field-explorer .pcie-field--msg{background:var(--pcie-msg)}
#pcie-field-explorer .pcie-field--extra{background:var(--pcie-extra)}
#pcie-field-explorer .pcie-field--reserved{background:var(--pcie-reserved);color:#65717f}
#pcie-field-explorer .pcie-field-name{display:block;font-weight:700;font-size:.8rem;white-space:normal;overflow-wrap:anywhere}
#pcie-field-explorer .pcie-field-bits{display:block;margin-top:.16rem;font-size:.66rem;color:#5e6874;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#pcie-field-explorer .pcie-detail-panel{display:none;position:absolute;z-index:100;width:min(390px,calc(100% - 1rem));padding:.8rem .95rem;background:var(--main-bg,#fff);border:1px solid var(--main-border-color,#c9cfd6);border-radius:.6rem;box-shadow:0 10px 32px rgba(0,0,0,.22);color:inherit}
#pcie-field-explorer .pcie-detail-panel.visible{display:block}
#pcie-field-explorer .pcie-detail-panel h4{margin:0 0 .38rem;font-size:.95rem}
#pcie-field-explorer .pcie-detail-panel code{font-size:.88em}
#pcie-field-explorer .pcie-detail-panel::before{content:"";position:absolute;top:-7px;left:22px;width:12px;height:12px;background:var(--main-bg,#fff);border-left:1px solid var(--main-border-color,#c9cfd6);border-top:1px solid var(--main-border-color,#c9cfd6);transform:rotate(45deg)}
#pcie-field-explorer .pcie-detail-meta{margin-top:.45rem;color:var(--text-muted-color,#777);font-size:.8rem}
#pcie-field-explorer .pcie-ohc-section{margin-top:1.35rem;border-top:1px solid var(--main-border-color,#ddd);padding-top:1rem}
#pcie-field-explorer .pcie-ohc-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
#pcie-field-explorer .pcie-ohc-head h4{margin:0}
#pcie-field-explorer .pcie-ohc-tabs{display:flex;gap:.35rem;flex-wrap:wrap}
#pcie-field-explorer .pcie-ohc-tabs button{border:1px solid var(--main-border-color,#aaa);background:var(--card-bg,#fff);color:inherit;border-radius:999px;padding:.25rem .55rem;cursor:pointer;font-size:.78rem}
#pcie-field-explorer .pcie-ohc-tabs button.active{background:var(--link-color,#4a78c2);color:#fff;border-color:var(--link-color,#4a78c2)}
#pcie-field-explorer .pcie-ohc-note{margin:.5rem 0 .7rem;color:var(--text-muted-color,#777);font-size:.86rem}
html[data-mode="dark"] #pcie-field-explorer{--pcie-control:#243b5a;--pcie-id:#3c3157;--pcie-address:#294735;--pcie-length:#554820;--pcie-be:#573232;--pcie-msg:#5a4027;--pcie-extra:#29474b;--pcie-reserved:#343a42;--pcie-neutral:#303943}
html[data-mode="dark"] #pcie-field-explorer .pcie-field{color:#edf2f7}
html[data-mode="dark"] #pcie-field-explorer .pcie-field-bits{color:#bdc7d2}
@media(max-width:760px){#pcie-field-explorer .pcie-dw{min-width:640px}#pcie-field-explorer .pcie-detail-panel{width:min(340px,calc(100% - .6rem))}}
</style>

<script>
(()=>{
const root=document.getElementById('pcie-field-explorer'); if(!root||root.dataset.ready)return; root.dataset.ready='1';
const $=s=>root.querySelector(s);
const f=(name,hi,lo,desc,extra='')=>({name,hi,lo,desc,extra});
const commonNfm=()=>[f('Fmt',31,29,'TLP format: header length and whether Data is present.'),f('Type',28,24,'NFM Type[4:0]. Together with Fmt it identifies the TLP type.'),f('T9',23,23,'Tag bit 9 when applicable.'),f('TC',22,20,'Traffic Class.'),f('T8',19,19,'Tag bit 8 when applicable.'),f('Attr/LN/TH',18,16,'Attribute and request-specific control bits. Exact meaning depends on TLP family.'),f('TD',15,15,'TLP Digest present in Non-Flit Mode.'),f('EP',14,14,'Poisoned TLP indication.'),f('Attr',13,12,'Attribute bits.'),f('AT',11,10,'Address Type where applicable.'),f('Length',9,0,'Payload length in DW.')];
const commonFm=()=>[f('Type[7:0]',31,24,'Fully-decoded Flit Mode TLP Type. It also selects the Header Base format/size.'),f('TC',23,21,'Traffic Class.'),f('OHC[4:0]',20,16,'Indicates which Orthogonal Header Content blocks follow the Header Base. OHC appears in A-B-C-E order.'),f('TS',15,13,'TLP Trailer Size / trailer indication in Flit Mode.'),f('Attr',12,10,'Transaction attributes.'),f('Length',9,0,'Payload length in DW.')];
const nfmReqId=()=>[f('Requester ID',31,16,'Requester Bus/Device/Function or Bus/Function identity.'),f('Tag[7:0]',15,8,'Low 8 Tag bits. T8/T9 are in DW0.'),f('Last DW BE',7,4,'Last DW Byte Enable.'),f('1st DW BE',3,0,'First DW Byte Enable.')];
const fmReqId=()=>[f('Requester ID',31,16,'Requester identity.'),f('EP',15,15,'Poisoned TLP indication.'),f('R',14,14,'Reserved.'),f('Tag[13:0]',13,0,'14-bit Tag carried directly in the FM Header Base.')];
const addr32n=()=>[f('Address[31:2]',31,2,'32-bit address, naturally aligned.'),f('PH / low bits',1,0,'Low aligned/request-specific bits; PH use follows NFM request rules.')];
const addr32f=()=>[f('Address[31:2]',31,2,'32-bit address.'),f('AT[1:0]',1,0,'Address Type.')];
const addr64hi=()=>[f('Address[63:32]',31,0,'Upper 32 bits of the 64-bit address.')];
const rowsReq=(bits,fm=false)=>fm?[commonFm(),fmReqId(),...(bits===64?[addr64hi(),addr32f()]:[addr32f()])]:[commonNfm(),nfmReqId(),...(bits===64?[addr64hi(),addr32n()]:[addr32n()])];
const rowsIo=(fm=false)=>fm?[commonFm(),fmReqId(),addr32f()]:[commonNfm(),nfmReqId(),addr32n()];
const rowsCfg=(fm=false)=>fm?[commonFm(),fmReqId(),[f('Destination BDF/BF',31,16,'Configuration destination identity.'),f('Ext Reg Num',15,12,'Extended Register Number.'),f('Register Number',11,2,'Configuration register number.'),f('R',1,0,'Reserved.')]]:[commonNfm(),nfmReqId(),[f('Destination ID',31,16,'Bus/Device/Function or Bus/Function destination.'),f('R',15,12,'Reserved.'),f('Ext Reg Num',11,8,'Extended Register Number.'),f('Register Number',7,2,'Register Number.'),f('R',1,0,'Reserved.')]];
const rowsCpl=(fm=false)=>fm?[commonFm(),[f('Completer ID',31,16,'Identity of the Completer.'),f('EP',15,15,'Poisoned Completion indication.'),f('LA[6]',14,14,'Upper bit of Lower Address.'),f('Tag[13:0]',13,0,'14-bit Tag.')],[f('Destination BDF/BF',31,16,'Destination corresponding to the original Requester.'),f('LA[5:2]',15,12,'Lower Address bits 5:2.'),f('Byte Count',11,0,'Remaining Byte Count.')]]:[commonNfm(),[f('Completer ID',31,16,'Identity of the Completer.'),f('Cpl Status',15,13,'Completion Status.'),f('BCM',12,12,'Byte Count Modified.'),f('Byte Count',11,0,'Remaining Byte Count.')],[f('Requester ID',31,16,'Requester identity from the original Request.'),f('Tag[7:0]',15,8,'Low Tag bits.'),f('R',7,7,'Reserved.'),f('Lower Address',6,0,'Lower byte address of returned data.')]];
const rowsMsg=(fm=false)=>fm?[commonFm(),[f('Requester ID',31,16,'Requester identity.'),f('EP',15,15,'Poisoned TLP indication.'),f('R',14,8,'Reserved for generic Message header.'),f('Message Code',7,0,'Identifies the Message.')],[f('Message-specific / Reserved',31,0,'Bytes 8-11 are Reserved except where a specific Message definition assigns fields.')],[f('Message-specific / Reserved',31,0,'Bytes 12-15 are Reserved except where a specific Message definition assigns fields.')]]:[commonNfm(),[f('Requester ID',31,16,'Requester identity.'),f('Tag',15,8,'Tag field used by Message semantics as defined.'),f('Message Code',7,0,'Identifies the Message.')],[f('Message-specific / Reserved',31,0,'Bytes 8-11 are Reserved except where a specific Message definition assigns fields.')],[f('Message-specific / Reserved',31,0,'Bytes 12-15 are Reserved except where a specific Message definition assigns fields.')]];
const types=[
['MRd32','mem32','000','00000','0x00','0x03','Type value changes because FM 0x00 is NOP.'],['MRd64','mem64','001','00000','0x20','0x20','1:1 semantic translation.'],['MWr32','mem32','010','00000','0x40','0x40','1:1 semantic translation.'],['MWr64','mem64','011','00000','0x60','0x60','1:1 semantic translation.'],['MRdLk32','mem32','000','00001','0x01','0x01','Locked Memory Read, 32-bit address.'],['MRdLk64','mem64','001','00001','0x21','0x21','Locked Memory Read, 64-bit address.'],['IORd','io','000','00010','0x02','0x02','OHC-A2 is required in FM.'],['IOWr','io','010','00010','0x42','0x42','OHC-A2 is required in FM.'],['CfgRd0','cfg','000','00100','0x04','0x04','OHC-A3 is required in FM.'],['CfgWr0','cfg','010','00100','0x44','0x44','OHC-A3 is required in FM.'],['CfgRd1','cfg','000','00101','0x05','0x05','OHC-A3 is required in FM.'],['CfgWr1','cfg','010','00101','0x45','0x45','OHC-A3 is required in FM.'],['Cpl','cpl','000','01010','0x0A','0x0A','Completion without Data. OHC-A5 is conditional.'],['CplD','cpl','010','01010','0x4A','0x4A','Completion with Data. OHC-A5 is conditional.'],['CplLk','cpl','000','01011','0x0B','0x0B','Locked Completion without Data.'],['CplDLk','cpl','010','01011','0x4B','0x4B','Locked Completion with Data.'],['FetchAdd32','mem32','010','01100','0x4C','0x4C','AtomicOp request using 32-bit address header form.'],['FetchAdd64','mem64','011','01100','0x6C','0x6C','AtomicOp request using 64-bit address header form.'],['Swap32','mem32','010','01101','0x4D','0x4D','AtomicOp request using 32-bit address header form.'],['Swap64','mem64','011','01101','0x6D','0x6D','AtomicOp request using 64-bit address header form.'],['CAS32','mem32','010','01110','0x4E','0x4E','AtomicOp request using 32-bit address header form.'],['CAS64','mem64','011','01110','0x6E','0x6E','AtomicOp request using 64-bit address header form.'],['Msg','msg','001','10rrr','0x30-0x37','0x30-0x37','Message without Data; r[2:0] selects routing.'],['MsgD','msg','011','10rrr','0x70-0x77','0x70-0x77','Message with Data; r[2:0] selects routing.']
].map(x=>({name:x[0],family:x[1],fmt:x[2],type:x[3],nfm:x[4],fm:x[5],note:x[6]}));
const ohc={
'A1':{note:'Memory Requests with explicit Byte Enables and/or PASID; also Translation Requests and some Address-Routed/RC-directed Messages with PASID.',rows:[[f('Last DW BE',31,28,'Last DW Byte Enable.'),f('1st DW BE',27,24,'First DW Byte Enable.'),f('PASID[19:0]',23,4,'Process Address Space ID.'),f('NW/PV/PMR/ER',3,0,'NW: No Write for Translation Requests; PV: PASID Valid; PMR/ER qualify privileged/execute semantics.')]]},
'A2':{note:'Required for every I/O Request in Flit Mode.',rows:[[f('Last DW BE',31,28,'Last DW Byte Enable.'),f('1st DW BE',27,24,'First DW Byte Enable.'),f('Reserved',23,0,'Reserved.')]]},
'A3':{note:'Required for Configuration Requests; carries Byte Enables and Destination Segment information.',rows:[[f('Last DW BE',31,28,'Last DW Byte Enable.'),f('1st DW BE',27,24,'First DW Byte Enable.'),f('Destination Segment',23,16,'Destination Segment when DSV is set.'),f('DSV / Reserved',15,0,'Destination Segment Valid plus reserved bits.')]]},
'A4':{note:'Used by ID-Routed Messages when Destination Segment and/or PASID is required.',rows:[[f('Destination Segment',31,24,'Destination Segment if DSV=1.'),f('PASID[15:8]',23,16,'PASID bits 15:8.'),f('DSV/PV/PMR/R/PASID[19:16]',15,8,'Validity/control plus upper PASID bits.'),f('PASID[7:0]',7,0,'PASID bits 7:0.')]]},
'A5':{note:'Required for unsuccessful Completions, for Non-UIO Completions with LA[1:0] != 00b, and when explicit segment information is required.',rows:[[f('Destination Segment',31,24,'Destination Segment if DSV=1.'),f('Completer Segment',23,16,'Segment containing the Completer.'),f('DSV / Reserved',15,8,'Destination Segment Valid plus reserved bits.'),f('LA[1:0] / Cpl Status',7,0,'Lower Address[1:0] and Completion Status, with remaining bits reserved.')]]},
'B':{note:'Used for TLP Processing Hints on applicable Address-Routed Requests.',rows:[[f('Reserved',31,24,'Reserved.'),f('ST[15:8]',23,16,'Steering Tag upper byte.'),f('ST[7:0]',15,8,'Steering Tag lower byte.'),f('PH/HV/AMA/AV',7,0,'Processing Hint, Hints Valid, Address Matching Attribute and AMA Valid.')]]},
'C':{note:'Required for IDE TLPs; also used in some non-IDE cases to carry Requester Segment information.',rows:[[f('Requester Segment',31,24,'Requester Segment; valid when RSV is set.'),f('PR_Sent_Counter',23,16,'IDE replay/protection-related counter.'),f('Stream_ID',15,8,'IDE Stream ID.'),f('Sub-Stream/RSV/R/K/T',7,0,'IDE sub-stream and control bits, including Requester Segment Valid.')]]}
};
function layoutFor(t,fm){if(t.family==='mem32')return rowsReq(32,fm);if(t.family==='mem64')return rowsReq(64,fm);if(t.family==='io')return rowsIo(fm);if(t.family==='cfg')return rowsCfg(fm);if(t.family==='cpl')return rowsCpl(fm);return rowsMsg(fm)}
function ohcFor(t){if(t.family==='mem32'||t.family==='mem64')return['A1','B','C'];if(t.family==='io')return['A2','C'];if(t.family==='cfg')return['A3','C'];if(t.family==='cpl')return['A5','C'];return['A1','A4','B','C']}
function bitsText(x){return x.hi===x.lo?`bit ${x.hi}`:`bits ${x.hi}:${x.lo}`}
function fieldClass(x){const n=x.name.toLowerCase();if(n==='r'||n.includes('reserved'))return'pcie-field--reserved';if(n.includes('byte enable')||n.includes(' dw be')||n.includes('1st dw be')||n.includes('last dw be'))return'pcie-field--be';if(n.includes('address')||/^la\[/.test(n)||n.includes('lower addr'))return'pcie-field--address';if(n.includes('length')||n.includes('byte count'))return'pcie-field--length';if(n.includes('requester')||n.includes('completer')||n.includes('destination')||n.includes('tag')||n.includes('segment'))return'pcie-field--id';if(n.includes('message'))return'pcie-field--msg';if(n.includes('pasid')||n.includes('stream')||n.includes('st[')||n.includes('ph/')||n.includes('dsv')||n.includes('nw/')||n.includes('sub-stream'))return'pcie-field--extra';if(n.includes('fmt')||n.includes('type')||n==='tc'||n.includes('attr')||n==='td'||n==='ep'||n.includes('ohc')||n==='ts'||n.startsWith('at')||n.includes('status')||n==='bcm'||n.includes('ph /'))return'pcie-field--control';return''}
function ruler(){return `<div class="pcie-bit-ruler">${Array.from({length:32},(_,i)=>`<span>${31-i}</span>`).join('')}</div>`}
function hideDetail(){const p=$('.pcie-detail-panel');p.classList.remove('visible');p.setAttribute('aria-hidden','true');root.querySelectorAll('.pcie-field.is-active').forEach(x=>x.classList.remove('is-active'))}
function positionDetail(anchor){const panel=$('.pcie-detail-panel'),rr=root.getBoundingClientRect(),ar=anchor.getBoundingClientRect();panel.classList.add('visible');panel.setAttribute('aria-hidden','false');const pw=panel.offsetWidth,ph=panel.offsetHeight;let left=ar.left-rr.left+Math.min(ar.width/2,28)-22;left=Math.max(4,Math.min(left,root.clientWidth-pw-4));let top=ar.bottom-rr.top+10;if(top+ph>root.clientHeight&&ar.top-rr.top-ph-10>0)top=ar.top-rr.top-ph-10;panel.style.left=`${left}px`;panel.style.top=`${top}px`}
function renderRows(el,rows,mode,t){el.innerHTML='';rows.forEach((r,i)=>{const wrap=document.createElement('div');wrap.className='pcie-dw';wrap.innerHTML=`<div class="pcie-dw-label">DW${i}</div>${ruler()}<div class="pcie-fields"></div>`;const g=wrap.querySelector('.pcie-fields');r.forEach(x=>{const b=document.createElement('button');b.type='button';b.className=`pcie-field ${fieldClass(x)}`.trim();b.style.gridColumn=`${32-x.hi} / ${33-x.lo}`;b.innerHTML=`<span class="pcie-field-name">${x.name}</span><span class="pcie-field-bits">${x.hi===x.lo?x.hi:x.hi+':'+x.lo}</span>`;b.addEventListener('click',e=>{e.stopPropagation();root.querySelectorAll('.pcie-field.is-active').forEach(y=>y.classList.remove('is-active'));b.classList.add('is-active');showDetail(`${mode} · DW${i} · ${x.name}`,x,t,b)});g.appendChild(b)});el.appendChild(wrap)})}
function showDetail(title,x,t,anchor){$('#pcie-detail-title').textContent=title;$('#pcie-detail-body').innerHTML=`<strong>${bitsText(x)}</strong><br>${x.desc}${x.extra?'<br>'+x.extra:''}<div class="pcie-detail-meta">Current TLP: ${t.name}; NFM ${t.nfm} → FM ${t.fm}.</div>`;positionDetail(anchor)}
function renderOHC(t){const names=ohcFor(t),tabs=$('#pcie-ohc-tabs');tabs.innerHTML='';names.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent='OHC-'+n;b.addEventListener('click',()=>drawOHC(n,t,b));tabs.appendChild(b);if(i===0)setTimeout(()=>drawOHC(n,t,b),0)})}
function drawOHC(n,t,btn){root.querySelectorAll('.pcie-ohc-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const o=ohc[n];$('#pcie-ohc-note').textContent=o.note;renderRows($('#pcie-ohc-layout'),o.rows,'OHC-'+n,t);hideDetail()}
function selectType(t){$('#pcie-type-summary').textContent=`NFM ${t.nfm}  →  FM ${t.fm} · ${t.note}`;$('#pcie-nfm-meta').textContent=`Fmt=${t.fmt}, Type=${t.type}, Byte0=${t.nfm}`;$('#pcie-fm-meta').textContent=`Type[7:0]=${t.fm}`;renderRows($('#pcie-nfm'),layoutFor(t,false),'NFM',t);renderRows($('#pcie-fm'),layoutFor(t,true),'FM',t);renderOHC(t);hideDetail()}
root.addEventListener('click',e=>{if(!e.target.closest('.pcie-field')&&!e.target.closest('.pcie-detail-panel'))hideDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideDetail()});window.addEventListener('resize',hideDetail,{passive:true});
const sel=$('#pcie-type-select');types.forEach((t,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=t.name;sel.appendChild(o)});sel.addEventListener('change',()=>selectType(types[Number(sel.value)]));sel.value=types.findIndex(x=>x.name==='MWr64');selectType(types[Number(sel.value)]);
})();
</script>
