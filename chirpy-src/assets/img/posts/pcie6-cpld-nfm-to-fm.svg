<text x="775" y="528" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#111">Main differences</text>
<text x="775" y="555" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#111">• Type stays 0x4A.</text>
<text x="775" y="578" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#111">• Tag expands to 14 bits.</text>
<text x="775" y="601" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#111">• Requester ID becomes Destination BDF/BF.</text>
<text x="775" y="624" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#111">• Extra completion semantics use OHC-A5.</text>
<text x="30" y="995" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#666">Based on PCIe 5.0 Figure 2-38 and PCIe 6.0 Figure 2-76.</text>
