<text x="775" y="548" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#111" text-anchor="start">Main differences</text>
<text x="775" y="575" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#111" text-anchor="start">• Fmt is absorbed into Type.</text>
<text x="775" y="598" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#111" text-anchor="start">• Tag expands: 10b → 14b.</text>
<text x="775" y="621" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#111" text-anchor="start">• BE / Prefix-related extras use OHC.</text>
<text x="30" y="955" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#666" text-anchor="start">Based on PCIe 5.0 Figure 2-17 and PCIe 6.0 Figure 2-39.</text>
