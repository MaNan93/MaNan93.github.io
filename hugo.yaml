baseURL: https://manan93.github.io/
title: MaNan Notes
locale: zh-CN
defaultContentLanguage: zh-cn
hasCJKLanguage: true
enableRobotsTXT: true
enableGitInfo: true

theme: hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: 专题
      pageRef: /docs
      weight: 1
    - name: 文章
      pageRef: /blog
      weight: 2
    - name: 工具
      pageRef: /tools
      weight: 3
    - name: 关于
      pageRef: /about
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      url: https://github.com/MaNan93
      weight: 6
      params:
        icon: github

params:
  description: MaNan 的数字 IC、PCIe 与工程工具学习笔记。
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      js: js/vendor/flexsearch.bundle.min.js
      tokenize: forward
  footer:
    enable: true
    displayCopyright: true
  page:
    width: normal
    displayPagination: true
  editURL:
    enable: false

outputs:
  home: [html, rss]
  section: [html, rss]
